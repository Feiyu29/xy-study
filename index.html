<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#40a3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="赫赫学习">
<title>赫赫小学学习工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --primary:#40a3f5;
  --primary-light:#e8f3fe;
  --primary-dark:#2e8ad6;
  --yellow:#ffc107;
  --yellow-light:#fff4cc;
  --green:#3fb95c;
  --red:#e7434b;
  --purple:#9b6ed8;
  --purple-light:#e9dff9;
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#1f2937;
  --text-sub:#6b7280;
  --text-light:#9ca3af;
  --border:#e5e7eb;
  --shadow:0 2px 10px rgba(0,0,0,.04);
  --shadow-hover:0 4px 16px rgba(0,0,0,.08);
  --radius:14px;
  --radius-sm:10px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.topbar{
  background:var(--primary);height:64px;display:flex;align-items:center;padding:0 24px;
  position:sticky;top:0;z-index:50;color:#fff;box-shadow:0 2px 8px rgba(64,163,245,.15);
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;min-width:260px}
.topbar .brand-icon{font-size:26px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.topbar .date{flex:1;text-align:center;font-size:15px;opacity:.95}
.topbar .sun-btn{
  background:rgba(255,255,255,.18);padding:8px 16px;border-radius:30px;
  display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;
}
.sun-icon{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#ffd54f,#ff9800);position:relative}
.sun-icon::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.4),transparent 70%)}

.layout{display:flex;min-height:calc(100vh - 64px);position:relative}
.sidebar{
  width:220px;background:#fff;border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;
  position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sb-group{margin-bottom:16px}
.sb-group-title{padding:8px 24px;font-size:12px;color:var(--text-light);font-weight:500;letter-spacing:.5px}
.sb-item{
  display:flex;align-items:center;gap:12px;padding:12px 24px;cursor:pointer;
  color:var(--text);font-size:15px;border-left:3px solid transparent;transition:all .15s;user-select:none;
}
.sb-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.sb-item .ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-sub);flex-shrink:0}
.sb-item.active{background:var(--yellow-light);color:#e08e00;font-weight:600;border-left-color:var(--yellow)}
.sb-item.active .ico{color:#e08e00}

.main{flex:1;padding:24px 28px;min-width:0;overflow-x:hidden}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.scrim.show{display:block}
.menu-toggle{display:none;margin-right:12px;font-size:22px;cursor:pointer;color:#fff}

.section-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;margin-bottom:16px}
.section-title .ico{font-size:22px}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.stat-card{
  background:var(--card);border-radius:var(--radius);padding:28px 24px;
  display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.stat-card .ico{font-size:46px;line-height:1;margin-bottom:14px;height:56px;display:flex;align-items:center;justify-content:center}
.stat-card .num{font-size:48px;font-weight:700;color:var(--yellow);line-height:1.1;letter-spacing:-1px}
.stat-card .num.green{color:var(--green)}
.stat-card .num.red{color:var(--red)}
.stat-card .label{font-size:14px;color:var(--text-sub);margin-top:6px}

.poem-panel{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.poem-panel .panel-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;margin-bottom:16px}
.poem-panel .panel-title .ico{font-size:20px}
.poem-panel .divider{height:1px;background:var(--border);margin-bottom:18px}

.search-box{
  display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:24px;padding:10px 18px;margin-bottom:18px;transition:border .15s;
}
.search-box:focus-within{border-color:var(--primary);background:#fff}
.search-box .si{color:var(--text-light);font-size:16px}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--text)}

.cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-bar .cb{
  flex-shrink:0;padding:6px 14px;border-radius:18px;background:var(--bg);border:1px solid var(--border);
  font-size:13px;color:var(--text-sub);cursor:pointer;user-select:none;transition:all .15s;
}
.cat-bar .cb:hover{background:var(--primary-light);color:var(--primary-dark)}
.cat-bar .cb.active{background:var(--purple);color:#fff;border-color:var(--purple)}

.poem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.poem-card{
  background:var(--purple-light);border-radius:var(--radius);padding:20px 22px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;position:relative;
}
.poem-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(155,110,216,.18)}
.poem-card.learned{background:#dcf7e3}
.poem-card .pc-title{font-size:18px;font-weight:700;color:#6d3fb8;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.poem-card.learned .pc-title{color:#2e7d3a}
.poem-card .pc-author{font-size:13px;color:#8b6dc4;margin-bottom:10px;font-weight:500}
.poem-card.learned .pc-author{color:#4a8a52}
.poem-card .pc-content{font-size:14px;color:#4b5563;line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poem-card .pc-tag{display:inline-block;background:rgba(155,110,216,.18);color:#6d3fb8;font-size:12px;padding:3px 10px;border-radius:10px}
.poem-card.learned .pc-tag{background:rgba(63,185,92,.18);color:#2e7d3a}
.poem-card .pc-check{font-size:18px;color:var(--green)}

#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(44,62,45,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal-sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + var(--safe-bottom));max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.ms-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:#fff;z-index:5;padding-bottom:10px;border-bottom:1px solid var(--border)}
.ms-head h3{font-size:20px;font-weight:700;color:var(--primary-dark)}
.ms-head .close{font-size:28px;color:var(--text-light);padding:0 4px;line-height:1}

.detail-title{font-size:26px;font-weight:700;text-align:center;color:var(--primary-dark);margin-bottom:6px}
.detail-author{text-align:center;font-size:15px;color:var(--text-sub);margin-bottom:18px}
.detail-pinyin-row{
  display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;
  background:var(--primary-light);border-radius:var(--radius);padding:18px 12px;margin-bottom:16px;
}
.pp-char{display:inline-flex;flex-direction:column;align-items:center;min-width:28px;padding:2px 4px}
.pp-py{font-size:11px;color:var(--primary-dark);line-height:1.2;margin-bottom:3px;font-style:italic}
.pp-zi{font-size:20px;color:var(--text);font-weight:500;line-height:1.2}

.detail-section{margin-bottom:18px}
.detail-section h4{font-size:14px;color:var(--primary-dark);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-section .ds-content{font-size:15px;color:var(--text);line-height:1.8;background:var(--bg);padding:14px 16px;border-radius:10px}

.btn-read{
  background:var(--primary);color:#fff;padding:12px;border-radius:30px;font-size:15px;font-weight:600;
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 16px;
}
.btn-read:active{transform:scale(.98);background:var(--primary-dark)}
.btn-read.reading{background:var(--green)}

.btn-mark{
  background:var(--yellow-light);color:#b8860b;padding:12px;border-radius:30px;font-size:15px;font-weight:600;
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-mark.learned{background:#dcf7e3;color:#2e7d3a}

/* 页面切换 */
.main .page{display:none}
.main .page.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 通用模块样式 */
.hanzi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hanzi-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hanzi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.hanzi-card .hz{font-size:42px;color:var(--primary-dark);line-height:1.2;font-weight:500}
.hanzi-card .py{font-size:13px;color:var(--text-sub);margin-top:4px;font-style:italic}
.hanzi-card .ci{font-size:11px;color:var(--text-light);margin-top:6px}
.flip-back{background:var(--primary-light);padding:10px;font-size:12px;color:var(--text);border-radius:8px;margin-top:8px;line-height:1.5}

.math-q{background:#fff;border-radius:var(--radius);padding:24px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.math-q .mq-text{font-size:32px;font-weight:700;color:var(--text);margin-bottom:18px}
.math-q .mq-input{font-size:24px;width:90px;text-align:center;border:2px solid var(--primary);border-radius:10px;padding:8px}
.math-opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.math-opts .mo{padding:8px 16px;border-radius:20px;background:var(--bg);border:1px solid var(--border);font-size:13px;cursor:pointer}
.math-opts .mo.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.math-stat{display:flex;gap:12px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.math-stat .ms{background:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow)}
.math-stat .ms b{color:var(--primary-dark);font-size:18px}

.think-card,.eng-card{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.think-card .tq{font-size:15px;font-weight:600;margin-bottom:10px}
.think-card .topts{display:flex;flex-direction:column;gap:6px}
.think-card .topt{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px}
.think-card .topt.right{background:#dcf7e3;border-color:var(--green);color:#2e7d3a}
.think-card .topt.wrong{background:#ffe0e0;border-color:var(--red);color:#b91c1c}

.eng-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.eng-card .ew{font-size:22px;font-weight:700;color:var(--primary-dark)}
.eng-card .ep{font-size:13px;color:var(--text-sub);margin:4px 0}
.eng-card .ecn{font-size:13px;color:var(--text)}

.reward-item{display:flex;align-items:center;gap:14px;background:#fff;padding:16px;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.reward-item .ri{font-size:32px}
.reward-item .rt{flex:1}
.reward-item .rn{font-size:15px;font-weight:600}
.reward-item .rd{font-size:12px;color:var(--text-light)}
.reward-item .rb{background:var(--yellow);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal-cell{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-sub);border:1px solid var(--border)}
.cal-cell.head{background:var(--primary);color:#fff;font-weight:600}
.cal-cell.done{background:#dcf7e3;color:#2e7d3a;font-weight:600}
.cal-cell.today{border:2px solid var(--primary);font-weight:700}

.base-screen{background:linear-gradient(135deg,#2d3a4a,#1a2530);border-radius:var(--radius);padding:24px;color:#fff;text-align:center;margin-bottom:16px}
.base-screen .bs-score{font-size:32px;font-weight:700;color:var(--yellow)}
.base-screen .bs-wave{font-size:14px;opacity:.8;margin-top:6px}

/* 幼儿园启蒙 */
.kids-hero{
  background:linear-gradient(135deg,#7BC8F6 0%,#B8E0F6 100%);
  border-radius:18px;padding:24px;color:#fff;margin-bottom:18px;box-shadow:0 6px 20px rgba(123,200,246,.3);
}
.kids-hero .kh-title{font-size:22px;font-weight:700}
.kids-hero .kh-sub{font-size:13px;opacity:.9;margin-top:4px}
.kids-entry-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.kids-entry-card{
  background:#fff;border-radius:18px;padding:24px 16px;text-align:center;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;border:2px solid transparent;
}
.kids-entry-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.kids-entry-card:active{transform:scale(.97)}
.kids-entry-card .ke-icon{font-size:48px;line-height:1;margin-bottom:12px}
.kids-entry-card .ke-name{font-size:17px;font-weight:700;color:var(--text)}
.kids-entry-card .ke-desc{font-size:12px;color:var(--text-light);margin-top:4px}
.ke-abc{background:linear-gradient(180deg,#FFF9E6 0%,#fff 100%);border-color:#FFE082}
.ke-num{background:linear-gradient(180deg,#E8F5E9 0%,#fff 100%);border-color:#A5D6A7}

/* 英语卡片网格 */
.kids-cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;scrollbar-width:none}
.kids-cat-bar::-webkit-scrollbar{display:none}
.kids-cat-bar .kcb{flex-shrink:0;padding:7px 16px;border-radius:18px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text-sub);cursor:pointer}
.kids-cat-bar .kcb.active{background:#7BC8F6;color:#fff;border-color:#7BC8F6}
.kids-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.kids-card{
  border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer;
  transition:transform .15s,box-shadow .15s;position:relative;
}
.kids-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.kids-card:active{transform:scale(.95)}
.kids-card .kc-emoji{font-size:44px;line-height:1;margin-bottom:10px}
.kids-card .kc-cn{font-size:16px;font-weight:700;color:#333;margin-bottom:4px}
.kids-card .kc-en{font-size:18px;font-weight:700;margin-bottom:4px}
.kids-card .kc-phon{font-size:11px;color:#666;font-style:italic;margin-bottom:8px}
.kids-card .kc-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.6)}
/* 卡片配色 */
.kc-c-yellow{background:#FFF4D6}.kc-c-yellow .kc-en{color:#E69500}.kc-c-yellow .kc-tag{color:#B8860B;background:#FFE9A8}
.kc-c-green{background:#E3F2E8}.kc-c-green .kc-en{color:#2E7D3A}.kc-c-green .kc-tag{color:#2E7D3A;background:#C8E6C9}
.kc-c-blue{background:#E3F2FD}.kc-c-blue .kc-en{color:#1565C0}.kc-c-blue .kc-tag{color:#1565C0;background:#BBDEFB}
.kc-c-pink{background:#FCE4EC}.kc-c-pink .kc-en{color:#C2185B}.kc-c-pink .kc-tag{color:#C2185B;background:#F8BBD0}
.kc-c-purple{background:#EDE7F6}.kc-c-purple .kc-en{color:#5E35B1}.kc-c-purple .kc-tag{color:#5E35B1;background:#D1C4E9}
.kc-c-orange{background:#FFF0E0}.kc-c-orange .kc-en{color:#E65100}.kc-c-orange .kc-tag{color:#E65100;background:#FFE0B2}

/* 大图弹窗 */
.kids-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.kids-modal-mask.show{display:flex}
.kids-big-card{
  border-radius:24px;padding:32px 24px;text-align:center;max-width:340px;width:100%;
  animation:bounceIn .4s cubic-bezier(.68,-.55,.265,1.55);
}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.kids-big-card .kbc-emoji{font-size:96px;line-height:1;margin-bottom:16px}
.kids-big-card .kbc-cn{font-size:24px;font-weight:700;margin-bottom:8px}
.kids-big-card .kbc-en{font-size:30px;font-weight:700;margin-bottom:6px}
.kids-big-card .kbc-phon{font-size:14px;color:#555;font-style:italic;margin-bottom:18px}
.kids-big-card .kbc-tip{background:rgba(255,255,255,.6);border-radius:12px;padding:10px;font-size:14px;margin-bottom:14px}
.kids-big-card .kbc-close{background:rgba(255,255,255,.7);border-radius:20px;padding:8px 24px;font-size:14px;font-weight:600}

/* 数字卡片 */
.num-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
.num-card{background:#fff;border-radius:16px;padding:20px 14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);border:1.5px solid #E3F2FD}
.num-card .nc-big{font-size:54px;font-weight:700;color:#1565C0;line-height:1}
.num-card .nc-cn{font-size:18px;color:#333;margin:6px 0 2px;font-weight:600}
.num-card .nc-en{font-size:15px;color:#1565C0;font-style:italic;margin-bottom:10px}
.num-card .nc-emoji{font-size:28px;letter-spacing:2px}
.num-card .nc-say{display:inline-block;margin-top:8px;background:#E3F2FD;color:#1565C0;font-size:12px;padding:4px 12px;border-radius:12px;cursor:pointer}

@media (max-width:1024px){
@media (max-width:640px){
  .topbar{padding:0 14px;height:56px}
  .topbar .brand{font-size:15px;min-width:auto}
  .topbar .brand-icon{font-size:22px;width:30px;height:30px}
  .topbar .date{display:none}
  .topbar .sun-btn{padding:6px 12px;font-size:13px}
  .layout{min-height:calc(100vh - 56px)}
  .sidebar{top:56px;height:calc(100vh - 56px)}
  .main{padding:16px 14px}
  .section-title{font-size:17px}
  .cards-row{grid-template-columns:1fr;gap:12px;margin-bottom:20px}
  .stat-card{padding:20px;flex-direction:row;justify-content:space-between;gap:14px}
  .stat-card .ico{font-size:32px;margin-bottom:0;height:auto}
  .stat-card .num{font-size:32px}
  .stat-card .label{font-size:13px}
  .stat-card .txt{text-align:right}
  .poem-grid{grid-template-columns:1fr;gap:12px}
  .poem-card{padding:16px}
  .poem-card .pc-title{font-size:16px}
  .detail-title{font-size:22px}
  .pp-zi{font-size:18px}
}
</style>
</head>
<body>

<header class="topbar">

<script src="poems-data.js"></script>
<script>
const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const d=new Date();
document.getElementById('topDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${wk[d.getDay()]}`;

function setActive(el){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  if(window.innerWidth<=1024) closeSidebar();
}
function goPage(name, el){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  else {
    // 子页面（无菜单项）：高亮对应父菜单
    const map={kidsabc:'kids',kidsnum:'kids'};
    const parent=map[name];
    if(parent){
      const item=document.querySelector(`.sb-item[data-page="${parent}"]`);
      if(item) item.classList.add('active');
    }
  }
  document.querySelectorAll('.main .page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(window.innerWidth<=1024) closeSidebar();
  const initMap={chinese:renderChinese,math:renderMath,think:renderThink,english:renderEnglish,wrong:renderWrong,base:renderBase,reward:renderReward,calendar:renderCalendar,kidsabc:renderKidsAbc,kidsnum:renderKidsNum};
  if(initMap[name]) initMap[name]();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show');stopRead()}
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m){m.classList.remove('show');stopRead()}}));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

// 学习状态存储
let learned = JSON.parse(localStorage.getItem('xy_learned_v1')||'{}');
function saveLearned(){localStorage.setItem('xy_learned_v1',JSON.stringify(learned))}
function isLearned(n){return !!learned[n]}

let curCat='all';
const CATS=['全部','春天','夏天','秋天','冬天','山水','田园','思乡','送别','边塞','怀古','忧国','咏物','励志','感恩','哲理','春节','动物','咏怀'];

function renderCatBar(){
  document.getElementById('catBar').innerHTML=CATS.map((c,i)=>`<div class="cb ${i===0?'active':''}" data-c="${i===0?'all':c}" onclick="pickCat('${i===0?'all':c}')">${c}</div>`).join('');
}
function pickCat(c){
  curCat=c;
  document.querySelectorAll('.cat-bar .cb').forEach(b=>b.classList.toggle('active',b.dataset.c===c));
  filterPoems();
}
function getFiltered(){
  const kw=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  let arr=POEMS;
  if(curCat!=='all') arr=arr.filter(p=>p.tag===curCat);
  if(kw) arr=arr.filter(p=>p.title.includes(kw)||p.author.toLowerCase().includes(kw)||p.tag.includes(kw));
  return arr;
}
function renderPoems(list){
  const grid=document.getElementById('poemGrid');
  if(list.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-light)">🔍 没有找到相关古诗</div>`;return}
  grid.innerHTML=list.map(p=>{
    const learnedCls=isLearned(p.n)?'learned':'';
    const check=isLearned(p.n)?'<span class="pc-check">✅</span>':'';
    return `<div class="poem-card ${learnedCls}" onclick="openDetail(${p.n})">
      <div class="pc-title"><span>${p.n}. ${p.title}</span>${check}</div>
      <div class="pc-author">【${p.author}】</div>
      <div class="pc-content">${p.content}</div>
      <span class="pc-tag">${p.tag}</span>
    </div>`;
  }).join('');
  document.getElementById('resultCount').textContent=`共 ${list.length} 首`;
}
function filterPoems(){renderPoems(getFiltered())}

// 更新统计
function updateStats(){
  const cnt=Object.keys(learned).filter(k=>learned[k]).length;
  document.getElementById('learnedCount').textContent=cnt;
  document.getElementById('progressPct').textContent=Math.round(cnt/100*100)+'%';
}

// 详情弹窗
let curDetail=null;
function openDetail(n){
  const p=POEMS.find(x=>x.n===n);
  if(!p) return;
  curDetail=p;
  // 拼音逐字
  const chars=p.content.split('');
  const pyRow = p.pinyinChars ? p.pinyinChars.map(py=>`<span class="pp-char"><span class="pp-py">${py}</span><span class="pp-zi"></span></span>`).join('') : '';
  // 简单逐字对齐：直接按字符显示
  const charHtml = chars.map((c,i)=>{
    const py = p.pinyinChars ? (p.pinyinChars[i]||'') : '';
    return `<span class="pp-char"><span class="pp-py">${py}</span><span class="pp-zi">${c}</span></span>`;
  }).join('');

  const learnedFlag=isLearned(n);
  document.getElementById('detailBody').innerHTML=`
    <div class="detail-title">${p.title}</div>
    <div class="detail-author">【${p.author}】</div>
    <div class="detail-pinyin-row">${charHtml}</div>
    <button class="btn-read" id="readBtn" onclick="toggleRead()">🔊 朗读</button>
    <div class="detail-section">
      <h4>📝 译文</h4>
      <div class="ds-content">${p.translate||'暂无译文'}</div>
    </div>
    <div class="detail-section">
      <h4>💡 赏析</h4>
      <div class="ds-content">${p.appreciation||'暂无赏析'}</div>
    </div>
    <div class="detail-section">
      <h4>👤 作者介绍</h4>
      <div class="ds-content">${p.authorIntro||'暂无介绍'}</div>
    </div>
    <button class="btn-mark ${learnedFlag?'learned':''}" onclick="toggleLearn()">${learnedFlag?'✅ 已学习，点击取消':'⭐ 标记为已学'}</button>
  `;
  openModal('detailModal');
}

// 朗读（Web Speech API）
let speaking=false;
function toggleRead(){
  if(speaking){stopRead();return}
  if(!curDetail) return;
  if(!('speechSynthesis' in window)){toast('浏览器不支持朗读');return}
  stopRead();
  const u=new SpeechSynthesisUtterance();
  u.text=curDetail.title+'，'+curDetail.author+'。'+curDetail.content+'。'+(curDetail.translate||'');
  u.lang='zh-CN';u.rate=0.85;u.pitch=1.05;
  u.onend=()=>{speaking=false;updateReadBtn()};
  u.onerror=()=>{speaking=false;updateReadBtn()};
  speechSynthesis.speak(u);
  speaking=true;
  updateReadBtn();
}
function stopRead(){if('speechSynthesis' in window){speechSynthesis.cancel()}speaking=false;updateReadBtn()}
function updateReadBtn(){
  const b=document.getElementById('readBtn');
  if(!b) return;
  if(speaking){b.textContent='⏸️ 停止朗读';b.classList.add('reading')}
  else{b.textContent='🔊 朗读'}
}

// 打卡
function toggleLearn(){
  if(!curDetail) return;
  const n=curDetail.n;
  if(learned[n]){delete learned[n];toast('已取消学习')}
  else{learned[n]=new Date().toISOString().slice(0,10);toast('✓ 已标记学习，加油！')}
  saveLearned();
  updateStats();
  // 更新弹窗按钮
  const btn=document.querySelector('.btn-mark');
  if(btn){
    const flag=isLearned(n);
    btn.classList.toggle('learned',flag);
    btn.textContent=flag?'✅ 已学习，点击取消':'⭐ 标记为已学';
  }
  filterPoems();
}

renderCatBar();
renderPoems(POEMS);
updateStats();

// ============ 汉字学习 ============
const HANZI=[
  {z:'日',p:'rì',c:'太阳、日子',ci:'今日 生日 日出'},
  {z:'月',p:'yuè',c:'月亮、月份',ci:'月亮 月光 月份'},
  {z:'水',p:'shuǐ',c:'水',ci:'水果 饮水 河水'},
  {z:'火',p:'huǒ',c:'火',ci:'火车 大火 火苗'},
  {z:'山',p:'shān',c:'山',ci:'山水 高山 山顶'},
  {z:'石',p:'shí',c:'石头',ci:'石头 岩石 玉石'},
  {z:'田',p:'tián',c:'田地',ci:'田地 田园 种田'},
  {z:'木',p:'mù',c:'树木',ci:'树木 木头 木材'},
  {z:'人',p:'rén',c:'人',ci:'人民 好人 大人'},
  {z:'口',p:'kǒu',c:'嘴',ci:'口才 出口 开口'},
  {z:'手',p:'shǒu',c:'手',ci:'手掌 双手 洗手'},
  {z:'目',p:'mù',c:'眼睛',ci:'目光 注目 节目'},
  {z:'大',p:'dà',c:'大',ci:'大家 大小 巨大'},
  {z:'小',p:'xiǎo',c:'小',ci:'小心 小孩 大小'},
  {z:'上',p:'shàng',c:'上',ci:'上下 上面 上学'},
  {z:'下',p:'xià',c:'下',ci:'下面 下雨 下车'},
  {z:'中',p:'zhōng',c:'中间',ci:'中国 中间 中心'},
  {z:'天',p:'tiān',c:'天空',ci:'天空 天气 今天'},
];
function renderChinese(){
  const el=document.getElementById('page-chinese');
  if(el.dataset.rendered) return;
  el.dataset.rendered='1';
  el.innerHTML=`
    <div class="section-title"><span class="ico">📖</span><span>汉字学习</span></div>
    <div class="poem-panel">
      <div class="panel-title"><span class="ico">📖</span><span>常用汉字（点击翻看释义）</span></div>
      <div class="divider"></div>
      <div class="hanzi-grid" id="hanziGrid"></div>
    </div>`;
  document.getElementById('hanziGrid').innerHTML=HANZI.map((h,i)=>`
    <div class="hanzi-card" onclick="flipHz(${i})" id="hz${i}">
      <div class="hz">${h.z}</div>
      <div class="py">${h.p}</div>
      <div class="ci">${h.ci.split(' ').slice(0,2).join(' ')}</div>
    </div>`).join('');
}
function flipHz(i){
  const c=document.getElementById('hz'+i);
  if(c.dataset.flip==='1'){c.dataset.flip='0';c.innerHTML=`<div class="hz">${HANZI[i].z}</div><div class="py">${HANZI[i].p}</div><div class="ci">${HANZI[i].ci.split(' ').slice(0,2).join(' ')}</div>`}
  else{c.dataset.flip='1';c.innerHTML=`<div class="hz">${HANZI[i].z}</div><div class="flip-back"><b>${HANZI[i].p}</b> · ${HANZI[i].c}<br>组词：${HANZI[i].ci}</div>`}
}

// ============ 算术天地 ============
let mathOp='+',mathDiff=10,mathScore={right:0,wrong:0},mathCur=null;
function genMath(){
  let a,b,ans,txt;
  const r=Math.random()*mathDiff;
  a=Math.floor(Math.random()*mathDiff)+1;
  b=Math.floor(Math.random()*mathDiff)+1;
  if(mathOp==='+'){ans=a+b;txt=a+' + '+b+' = ?'}
  else if(mathOp==='-'){if(a<b)[a,b]=[b,a];ans=a-b;txt=a+' − '+b+' = ?'}
  else if(mathOp==='×'){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;txt=a+' × '+b+' = ?'}
  else{a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a;txt=(a*b)+' ÷ '+b+' = ?'}
  mathCur=ans;
  document.getElementById('mqText').textContent=txt;
  document.getElementById('mqInput').value='';
  document.getElementById('mqInput').focus();
}
function checkMath(e){
  if(e.key!=='Enter')return;
  const v=parseInt(document.getElementById('mqInput').value);
  if(v===mathCur){mathScore.right++;toast('✓ 答对了，真棒！')}
  else{mathScore.wrong++;toast('✗ 再试试，答案是 '+mathCur)}
  document.getElementById('msRight').textContent=mathScore.right;
  document.getElementById('msWrong').textContent=mathScore.wrong;
  document.getElementById('msRate').textContent=mathScore.right+mathScore.wrong?Math.round(mathScore.right/(mathScore.right+mathScore.wrong)*100)+'%':'0%';
  setTimeout(genMath,800);
}
function renderMath(){
  const el=document.getElementById('page-math');
  if(el.dataset.rendered) return;
  el.dataset.rendered='1';
  el.innerHTML=`
    <div class="section-title"><span class="ico">🔢</span><span>算术天地</span></div>
    <div class="math-opts">
      <div class="mo active" onclick="setMathOp('+',this)">加法</div>
      <div class="mo" onclick="setMathOp('-',this)">减法</div>
      <div class="mo" onclick="setMathOp('×',this)">乘法</div>
      <div class="mo" onclick="setMathOp('÷',this)">除法</div>
    </div>
    <div class="math-opts">
      <div class="mo" onclick="setMathDiff(10,this)">10以内</div>
      <div class="mo active" onclick="setMathDiff(20,this)">20以内</div>
      <div class="mo" onclick="setMathDiff(50,this)">50以内</div>
    </div>
    <div class="math-stat">
      <div class="ms">✅ 对 <b id="msRight">0</b></div>
      <div class="ms">❌ 错 <b id="msWrong">0</b></div>
      <div class="ms">🎯 正确率 <b id="msRate">0%</b></div>
    </div>
    <div class="math-q">
      <div class="mq-text" id="mqText">点击开始</div>
      <input class="mq-input" id="mqInput" type="number" onkeydown="checkMath(event)" placeholder="答案">
      <div style="font-size:11px;color:var(--text-light);margin-top:10px">输入答案后按回车键</div>
    </div>`;
  genMath();
}
function setMathOp(o,el){mathOp=o;document.querySelectorAll('#page-math .math-opts:nth-child(2) .mo').forEach(x=>x.classList.remove('active'));el.classList.add('active');genMath()}
function setMathDiff(v,el){mathDiff=v;document.querySelectorAll('#page-math .math-opts:nth-child(3) .mo').forEach(x=>x.classList.remove('active'));el.classList.add('active');genMath()}

// ============ 思维学习 ============
const THINK=[
  {q:'找规律：2,4,6,8,？下一个是？',opts:['9','10','11','12'],a:3},
  {q:'哪个不是水果？',opts:['苹果','香蕉','西红柿','白菜'],a:3},
  {q:'1只猫=2条鱼，3只猫=?条鱼',opts:['4','5','6','7'],a:2},
  {q:'红绿灯中，"通行"是什么颜色？',opts:['红','黄','绿','蓝'],a:2},
  {q:'一年有几个季节？',opts:['2','3','4','5'],a:2},
  {q:'哪个数最大？',opts:['8','12','6','9'],a:1},
];
let thinkIdx=0;
function renderThink(){
  const el=document.getElementById('page-think');
  el.innerHTML=`<div class="section-title"><span class="ico">🧩</span><span>思维学习</span></div><div id="thinkBox"></div>`;
  showThink();
}
function showThink(){
  const t=THINK[thinkIdx];
  document.getElementById('thinkBox').innerHTML=`
    <div class="think-card">
      <div class="tq">第${thinkIdx+1}题：${t.q}</div>
      <div class="topts" id="thinkOpts">
        ${t.opts.map((o,i)=>`<div class="topt" onclick="answerThink(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-light)">第 ${thinkIdx+1} / ${THINK.length} 题</div>
    </div>`;
}
function answerThink(i){
  const t=THINK[thinkIdx];
  const opts=document.getElementById('thinkOpts').children;
  if(i===t.a){opts[i].classList.add('right');toast('✓ 答对了！');}
  else{opts[i].classList.add('wrong');opts[t.a].classList.add('right');toast('✗ 正确答案是 '+String.fromCharCode(65+t.a));}
  setTimeout(()=>{thinkIdx=(thinkIdx+1)%THINK.length;showThink();},1200);
}

// ============ 打卡日历 ============
function renderCalendar(){
  const el=document.getElementById('page-calendar');
  const today=new Date();
  const y=today.getFullYear(),m=today.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const todayD=today.getDate();
  // 打卡记录（从 learned 推断已学日期）
  const doneDays=new Set();
  Object.values(learned).forEach(v=>{if(v){const dd=new Date(v);if(dd.getFullYear()===y&&dd.getMonth()===m)doneDays.add(dd.getDate())}});
  let cells='';
  ['日','一','二','三','四','五','六'].forEach(w=>cells+=`<div class="cal-cell head">${w}</div>`);
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell"></div>`;
  for(let i=1;i<=days;i++)cells+=`<div class="cal-cell ${doneDays.has(i)?'done':''} ${i===todayD?'today':''}">${i}</div>`;
  el.innerHTML=`
    <div class="section-title"><span class="ico">📅</span><span>打卡日历</span></div>
    <div class="poem-panel">
      <div class="panel-title"><span class="ico">📅</span><span>${y}年${m+1}月 · 已打卡 ${doneDays.size} 天</span></div>
      <div class="divider"></div>
      <div class="cal-grid">${cells}</div>
      <div style="margin-top:14px;font-size:12px;color:var(--text-sub);display:flex;gap:16px">
        <span>🟢 已打卡</span><span>🔵 今天</span>
      </div>
    </div>`;
}

const KIDS_NUM=[
  {n:1,cn:'一',en:'one',phon:'/wʌn/',emoji:'🍎',repeat:1},
  {n:2,cn:'二',en:'two',phon:'/tuː/',emoji:'🐱',repeat:2},
  {n:3,cn:'三',en:'three',phon:'/θriː/',emoji:'⭐',repeat:3},
  {n:4,cn:'四',en:'four',phon:'/fɔːr/',emoji:'🌸',repeat:4},
  {n:5,cn:'五',en:'five',phon:'/faɪv/',emoji:'🎈',repeat:5},
  {n:6,cn:'六',en:'six',phon:'/sɪks/',emoji:'🍓',repeat:6},

function renderKidsNum(){
  const el=document.getElementById('page-kidsnum');
  el.innerHTML=`
    <div class="section-title"><span class="ico">🔢</span><span>认识数字 1-10</span></div>

      <button class="btn" style="flex:1" onclick="countAll()">🧮 跟着数一数</button>

function readNum(i){
  const x=KIDS_NUM[i];
  if(!('speechSynthesis' in window)){toast('不支持朗读');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=0.7;
  const u2=new SpeechSynthesisUtterance(x.cn+', '+x.cn+', '+(x.n+' ').repeat(x.repeat).trim());u2.lang='zh-CN';u2.rate=0.8;
  speechSynthesis.speak(u);
  setTimeout(()=>speechSynthesis.speak(u2),1200);
}
let counting=false;
function countAll(){
  if(counting)return;
  counting=true;
  let i=0;
  const step=()=>{
    if(i>=10){counting=false;toast('🎉 数完啦！');return}
    document.querySelectorAll('.num-card').forEach(c=>c.style.transform='');
    const c=document.getElementById('nc'+i);
    if(c){c.style.transform='scale(1.08)';c.style.transition='transform .3s';
      const x=KIDS_NUM[i];
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=0.7;
      speechSynthesis.speak(u);
      const u2=new SpeechSynthesisUtterance(x.cn);u2.lang='zh-CN';u2.rate=0.8;
      setTimeout(()=>speechSynthesis.speak(u2),700);
    }
    i++;setTimeout(step,1200);
  };
  step();
}
function quizNum(){
  const idx=Math.floor(Math.random()*10);
  const x=KIDS_NUM[idx];
  const mask=document.createElement('div');
  mask.className='kids-modal-mask show';
  mask.innerHTML=`<div class="kids-big-card" style="background:#E3F2FD">
    <div class="kbc-emoji">${x.emoji.repeat(x.repeat)}</div>
    <div class="kbc-cn" style="color:#1565C0">这是几个？</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0">
      ${[...Array(10)].map((_,i)=>`<button onclick="answerQuiz(${i+1},${x.n},this)" style="width:50px;height:50px;border-radius:12px;background:#fff;border:2px solid #BBDEFB;font-size:20px;font-weight:700;color:#1565C0">${i+1}</button>`).join('')}
    </div>
    <button class="kbc-close" onclick="this.closest('.kids-modal-mask').remove()">关闭</button>
  </div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)mask.remove()});
  document.body.appendChild(mask);
}
function answerQuiz(ans,correct,btn){
  if(ans===correct){
    btn.style.background='#A5D6A7';btn.style.borderColor='#2E7D3A';btn.style.color='#2E7D3A';
    toast('✓ 答对了！是 '+correct);
    const x=KIDS_NUM.find(k=>k.n===correct);
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=0.7;
    speechSynthesis.speak(u);
    setTimeout(()=>{const m=document.querySelector('.kids-modal-mask.show');if(m)m.remove()},1500);
  }else{
    btn.style.background='#FFCDD2';btn.style.borderColor='#C62828';btn.style.color='#C62828';
    toast('✗ 再数一数');
  }
}
