<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#40a3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="赫赫学习">
<title>赫赫学习工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --primary:#40a3f5;--primary-light:#e8f3fe;--primary-dark:#2e8ad6;
  --yellow:#ffc107;--yellow-light:#fff4cc;
  --green:#3fb95c;--green-light:#dcf7e3;
  --red:#e7434b;--purple:#9b6ed8;--purple-light:#e9dff9;
  --orange:#ff9800;--orange-light:#fff3e0;
  --bg:#f5f7fa;--card:#fff;--text:#1f2937;--text-sub:#6b7280;--text-light:#9ca3af;
  --border:#e5e7eb;--shadow:0 2px 10px rgba(0,0,0,.04);--shadow-hover:0 4px 16px rgba(0,0,0,.08);
  --radius:16px;--radius-sm:12px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:17px}

.topbar{background:var(--primary);height:64px;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:50;color:#fff;box-shadow:0 2px 8px rgba(64,163,245,.15)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;min-width:200px}
.topbar .brand-icon{font-size:28px}
.topbar .date{flex:1;text-align:center;font-size:15px;opacity:.95}
.topbar .sun-btn{background:rgba(255,255,255,.2);padding:8px 16px;border-radius:30px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.sun-icon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#ffd54f,#ff9800);position:relative}
.sun-icon::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.4),transparent 70%)}

.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sb-group-title{padding:10px 24px;font-size:14px;color:var(--text-light);font-weight:600;letter-spacing:.5px}
.sb-item{display:flex;align-items:center;gap:12px;padding:16px 24px;cursor:pointer;color:var(--text);font-size:17px;border-left:4px solid transparent;transition:all .15s;user-select:none}
.sb-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.sb-item .ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:22px}
.sb-item.active{background:var(--yellow-light);color:#e08e00;font-weight:600;border-left-color:var(--yellow)}

.main{flex:1;padding:24px 28px;min-width:0;overflow-x:hidden}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.scrim.show{display:block}
.menu-toggle{display:none;margin-right:12px;font-size:24px;cursor:pointer;color:#fff}

.section-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:600;margin-bottom:18px}
.section-title .ico{font-size:26px}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card .ico{font-size:42px;margin-bottom:10px;height:48px;display:flex;align-items:center;justify-content:center}
.stat-card .num{font-size:42px;font-weight:700;color:var(--yellow);line-height:1.1}
.stat-card .num.green{color:var(--green)}.stat-card .num.red{color:var(--red)}
.stat-card .label{font-size:15px;color:var(--text-sub);margin-top:6px}

.panel{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.panel-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;margin-bottom:14px}
.panel-title .ico{font-size:22px}
.divider{height:1px;background:var(--border);margin-bottom:18px}

.search-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--border);border-radius:24px;padding:12px 18px;margin-bottom:14px}
.search-box:focus-within{border-color:var(--primary);background:#fff}
.search-box .si{color:var(--text-light);font-size:20px}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:17px}

.cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-bar .cb{flex-shrink:0;padding:8px 18px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);font-size:15px;color:var(--text-sub);cursor:pointer;white-space:nowrap}
.cat-bar .cb.active{background:var(--purple);color:#fff;border-color:var(--purple)}

/* 古诗卡片 */
.poem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.poem-card{background:var(--purple-light);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.poem-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(155,110,216,.18)}
.poem-card.learned{background:var(--green-light)}
.poem-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.poem-card .pc-title{font-size:20px;font-weight:700;color:#6d3fb8}
.poem-card.learned .pc-title{color:#2e7d3a}
.poem-card .pc-check{font-size:24px;color:var(--green);cursor:pointer}
.poem-card .pc-author{font-size:15px;color:#8b6dc4;margin-bottom:10px;font-weight:500}
.poem-card.learned .pc-author{color:#4a8a52}
.poem-card .pc-content{font-size:16px;color:#4b5563;line-height:1.8;margin-bottom:12px}
.poem-card .pc-foot{display:flex;justify-content:space-between;align-items:center}
.poem-card .pc-tag{background:rgba(155,110,216,.18);color:#6d3fb8;font-size:13px;padding:4px 12px;border-radius:10px}
.poem-card.learned .pc-tag{background:rgba(63,185,92,.18);color:#2e7d3a}
.poem-card .pc-read{background:#fff;color:var(--primary-dark);font-size:14px;padding:6px 14px;border-radius:14px;display:flex;align-items:center;gap:4px}

.poem-card .pc-dynasty{display:inline-block;background:rgba(155,110,216,.15);color:#6d3fb8;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:8px}
.poem-card .pc-emoji{font-size:28px;margin-bottom:8px;text-align:center}
.poem-card .pc-translate{font-size:14px;color:#6b7280;line-height:1.7;margin-top:8px;padding:10px 12px;background:rgba(255,255,255,.5);border-radius:8px;border-left:3px solid var(--purple)}
.poem-card.learned .pc-translate{background:rgba(255,255,255,.4);border-left-color:var(--green)}


/* 英语卡片 */
.eng-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.eng-card{background:#fff;border-radius:16px;padding:18px 14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.06);border:2px solid #E8F5E9;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.eng-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(76,175,80,.15)}
.eng-card .ec-emoji{font-size:46px;line-height:1;margin-bottom:8px}
.eng-card .ec-en{font-size:19px;font-weight:700;color:#2E7D32;margin-bottom:4px;line-height:1.3}
.eng-card .ec-cn{font-size:16px;color:#555;margin-bottom:8px}
.eng-card .ec-read{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#E8F5E9;color:#2E7D32;font-size:18px}
.eng-card .ec-cat{position:absolute;top:6px;right:6px;background:rgba(76,175,80,.12);color:#2E7D32;font-size:11px;padding:2px 8px;border-radius:8px}

/* 数学数字卡片 */
.num-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
.num-card{background:#fff;border-radius:16px;padding:20px 14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);border:2px solid #E3F2FD;cursor:pointer;transition:transform .15s}
.num-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.num-card .nc-big{font-size:56px;font-weight:700;color:#1565C0;line-height:1}
.num-card .nc-cn{font-size:20px;color:#333;margin:6px 0 2px;font-weight:600}
.num-card .nc-en{font-size:16px;color:#1565C0;font-style:italic;margin-bottom:10px}
.num-card .nc-emoji{font-size:22px;letter-spacing:1px;word-break:break-all;line-height:1.4;min-height:34px}

/* 十格阵 */
.ten-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--bg);padding:14px;border-radius:12px;margin:12px 0}
.tf-cell{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid var(--border)}
.tf-cell.filled-a{background:#FFF4D6;border-color:#FFD54F}
.tf-cell.filled-b{background:#C8E6C9;border-color:#A5D6A7}
.calc-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow);border:2px solid var(--border)}
.calc-eq{font-size:36px;font-weight:700;text-align:center;color:var(--primary-dark);margin-bottom:10px}
.calc-emoji-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:30px;margin:10px 0}

/* 通用按钮 */
.btn-big{padding:16px;border-radius:30px;font-size:18px;font-weight:600;width:100%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-big:active{transform:scale(.98)}
.btn-big.ghost{background:var(--primary-light);color:var(--primary-dark)}
.big-btn-row{display:flex;gap:10px;margin-bottom:16px}
.big-btn{flex:1;padding:16px;border-radius:30px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.big-btn.primary{background:var(--primary);color:#fff}
.big-btn.outline{background:var(--primary-light);color:var(--primary-dark)}
.btn-read{background:var(--primary);color:#fff;padding:14px;border-radius:30px;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 16px}
.btn-read:active{transform:scale(.98);background:var(--primary-dark)}
.btn-read.reading{background:var(--green)}
.btn-mark{background:var(--yellow-light);color:#b8860b;padding:14px;border-radius:30px;font-size:17px;font-weight:600;width:100%}
.btn-mark.learned{background:var(--green-light);color:#2e7d3a}

/* 弹窗 */
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(44,62,45,.95);color:#fff;padding:14px 22px;border-radius:12px;font-size:16px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal-sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + var(--safe-bottom));max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.ms-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:#fff;z-index:5;padding-bottom:10px;border-bottom:1px solid var(--border)}
.ms-head h3{font-size:22px;font-weight:700;color:var(--primary-dark)}
.ms-head .close{font-size:36px;color:var(--text-light);padding:0 4px;line-height:1;cursor:pointer}

.eng-detail-emoji{font-size:80px;text-align:center;margin:10px 0 16px}
.eng-detail-en{font-size:28px;font-weight:700;color:#2E7D32;text-align:center;margin-bottom:6px}
.eng-detail-cn{font-size:20px;color:#666;text-align:center;margin-bottom:16px}
.detail-section{margin-bottom:18px}
.detail-section h4{font-size:16px;color:var(--primary-dark);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-section .ds-content{font-size:17px;color:var(--text);line-height:1.8;background:var(--bg);padding:14px 16px;border-radius:10px}

.page{display:none}
.page.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty .ei{font-size:42px;margin-bottom:8px;opacity:.5}

@media(max-width:1024px){
  .sidebar{position:fixed;left:-240px;top:64px;z-index:95;transition:left .25s;box-shadow:2px 0 12px rgba(0,0,0,.08)}
  .sidebar.open{left:0}
  .menu-toggle{display:block}
  .main{padding:20px}
}
@media(max-width:640px){
  body{font-size:16px}
  .topbar{padding:0 14px;height:56px}
  .topbar .brand{font-size:17px;min-width:auto}
  .topbar .brand-icon{font-size:24px}
  .topbar .date{display:none}
  .topbar .sun-btn{padding:6px 12px;font-size:14px}
  .layout{min-height:calc(100vh - 56px)}
  .sidebar{top:56px;height:calc(100vh - 56px);width:210px}
  .main{padding:16px 14px}
  .section-title{font-size:20px}
  .cards-row{grid-template-columns:1fr;gap:12px;margin-bottom:20px}
  .stat-card{padding:18px;flex-direction:row;justify-content:space-between;gap:14px}
  .stat-card .ico{font-size:32px;margin-bottom:0;height:auto}
  .stat-card .num{font-size:32px}
  .poem-grid,.num-grid,.eng-grid{grid-template-columns:1fr;gap:12px}
  .poem-card{padding:16px}
  .poem-card .pc-title{font-size:18px}
  .calc-eq{font-size:28px}
  .tf-cell{font-size:24px}
}
</style>
</head>
<body>

<header class="topbar">
  <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
  <div class="brand"><span class="brand-icon">🌻</span><span>赫赫学习工作台</span></div>
  <div class="date" id="topDate">--</div>
  <div class="sun-btn"><span class="sun-icon"></span><span id="sunPoints">0 阳光</span></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-group-title">学习天地</div>
    <div class="sb-item active" data-page="poem" onclick="go('poem',this)"><span class="ico">📜</span><span>古诗100首</span></div>
    <div class="sb-item" data-page="eng" onclick="go('eng',this)"><span class="ico">🔤</span><span>英语启蒙</span></div>
    <div class="sb-item" data-page="math" onclick="go('math',this)"><span class="ico">🔢</span><span>数学天地</span></div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeSidebar()"></div>

  <main class="main">
    <!-- 古诗100首 -->
    <div class="page active" id="page-poem">
      <div class="section-title"><span class="ico">📜</span><span>古诗100首</span></div>
      <div class="cards-row">
        <div class="stat-card"><div class="ico">📜</div><div class="num">100</div><div class="label">必学古诗</div></div>
        <div class="stat-card"><div class="ico">✅</div><div class="num green" id="learnedCount">0</div><div class="label">已学古诗</div></div>
        <div class="stat-card"><div class="ico">🎯</div><div class="num red" id="progressPct">0%</div><div class="label">学习进度</div></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="ico">📜</span><span>幼儿园必学古诗100首</span></div>
        <div class="divider"></div>
        <div class="search-box"><span class="si">🔍</span><input type="text" id="searchInput" placeholder="搜索诗名或作者..." oninput="filterPoems()"><span id="resultCount" style="font-size:14px;color:var(--text-light);white-space:nowrap">共100首</span></div>
        <div class="cat-bar" id="catBar"></div>
        <div class="poem-grid" id="poemGrid"></div>
      </div>
    </div>

    <!-- 英语启蒙 -->
    <div class="page" id="page-eng">
      <div class="section-title"><span class="ico">🔤</span><span>英语启蒙</span></div>
      <div class="cards-row">
        <div class="stat-card"><div class="ico">🔤</div><div class="num" id="engTotal">0</div><div class="label">单词短句</div></div>
        <div class="stat-card"><div class="ico">📂</div><div class="num green">13</div><div class="label">分类</div></div>
        <div class="stat-card"><div class="ico">🔊</div><div class="num red">慢速</div><div class="label">跟读朗读</div></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="ico">🔤</span><span>点击卡片听发音，跟读学习</span></div>
        <div class="divider"></div>
        <div class="search-box"><span class="si">🔍</span><input type="text" id="engSearch" placeholder="搜索英文单词..." oninput="filterEng()"><span id="engResultCount" style="font-size:14px;color:var(--text-light);white-space:nowrap">共0条</span></div>
        <div class="cat-bar" id="engCatBar"></div>
        <div class="eng-grid" id="engGrid"></div>
      </div>
    </div>

    <!-- 数学天地 -->
    <div class="page" id="page-math">
      <div class="section-title"><span class="ico">🔢</span><span>数学天地</span></div>
      <div class="big-btn-row">
        <button class="big-btn primary" id="mathModeNum" onclick="mathMode('num')">🔢 认识数字1-50</button>
        <button class="big-btn outline" id="mathModeCalc" onclick="mathMode('calc')">➕ 1-10图文加减法</button>
      </div>
      <div id="mathBox"></div>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- 英语详情弹窗 -->
<div class="modal-mask" id="engModal">
  <div class="modal-sheet">
    <div class="ms-head"><h3>🔤 英语学习</h3><span class="close" onclick="closeModal('engModal')">×</span></div>
    <div id="engBody"></div>
  </div>
</div>

<script>
// 版本自动刷新
(function(){var V='20260730d';var S=localStorage.getItem('xy_ver');if(S&&S!==V){localStorage.setItem('xy_ver',V);if(caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});location.reload(true);return}localStorage.setItem('xy_ver',V)})();

// ====== 朗读引擎（慢速+停顿，适合低龄跟读）======
let speaking=false;
function speak(text,lang,onEnd){
  if(!('speechSynthesis' in window)){toast('浏览器不支持朗读');return}
  stopSpeak();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||'zh-CN';
  u.rate=0.5;   // 超慢速，适合低龄跟读
  u.pitch=1.1;
  u.onend=()=>{speaking=false;if(onEnd)onEnd()};
  u.onerror=()=>{speaking=false};
  speechSynthesis.speak(u);
  speaking=true;
}
function stopSpeak(){if('speechSynthesis' in window){speechSynthesis.cancel()}speaking=false}

// ====== 页面切换 ======
function go(name,el){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(window.innerWidth<=1024)closeSidebar();
  if(name==='poem')renderPoems();
  if(name==='eng')renderEng();
  if(name==='math')mathMode('num');
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show');stopSpeak()}
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m){m.classList.remove('show');stopSpeak()}}));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

// ====== 初始化 ======
document.getElementById('topDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
let sunPoints=parseInt(localStorage.getItem('xy_sun')||'0');
document.getElementById('sunPoints').textContent=sunPoints+' 阳光';
function addSun(n){sunPoints+=n;localStorage.setItem('xy_sun',sunPoints);document.getElementById('sunPoints').textContent=sunPoints+' 阳光'}

// ====== 古诗模块 ======
const POEMS = [{n:1,title:"咏鹅",author:"骆宾王",dynasty:"唐",pinyin:"yǒng é",content:"鹅鹅鹅，曲项向天歌。白毛浮绿水，红掌拨清波。",pinyinChars:["é","é","é","qū","xiàng","xiàng","tiān","gē","bái","máo","fú","lǜ","shuǐ","hóng","zhǎng","bō","qīng","bō"],translate:"大白鹅呀大白鹅，弯着脖子向天唱歌。洁白的羽毛浮在绿水上，红色的脚掌拨动着清澈的水波。",appreciation:"这首诗以儿童的眼光观察鹅的形态与动作，色彩鲜明，动静结合，是骆宾王七岁时的作品。",authorIntro:"骆宾王（约640-684），唐代诗人，'初唐四杰'之一，七岁能诗。",tag:"动物",emoji:"🦢"},
{n:2,title:"春晓",author:"孟浩然",dynasty:"唐",pinyin:"chūn xiǎo",content:"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。",pinyinChars:["chūn","mián","bù","jué","xiǎo","chù","chù","wén","tí","niǎo","yè","lái","fēng","yǔ","shēng","huā","luò","zhī","duō","shǎo"],translate:"春日酣睡不知不觉天已破晓，到处都能听到鸟儿啼叫。昨夜风声雨声不断，不知有多少花瓣被吹落？",appreciation:"诗人寥寥数语勾勒春晨的慵懒与生机，'花落知多少'含惜春之情。",authorIntro:"孟浩然（689-740），唐代山水田园诗人，与王维并称'王孟'。",tag:"春天",emoji:"🌱"},
{n:3,title:"静夜思",author:"李白",dynasty:"唐",pinyin:"jìng yè sī",content:"床前明月光，疑是地上霜。举头望明月，低头思故乡。",pinyinChars:["chuáng","qián","míng","yuè","guāng","yí","shì","dì","shàng","shuāng","jǔ","tóu","wàng","míng","yuè","dī","tóu","sī","gù","xiāng"],translate:"床前洒满明亮月光，怀疑是地上结了一层霜。抬头望着明月，低头思念远方的故乡。",appreciation:"以'明月'与'霜'互喻，营造清冷孤寂的意境，'举头'与'低头'写出游子思乡心绪。",authorIntro:"李白（701-762），唐代伟大浪漫主义诗人，被誉为'诗仙'。",tag:"思乡",emoji:"🌙"},
{n:4,title:"悯农",author:"李绅",dynasty:"唐",pinyin:"mǐn nóng",content:"锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。",pinyinChars:["chú","hé","rì","dāng","wǔ","hàn","dī","hé","xià","tǔ","shuí","zhī","pán","zhōng","cān","lì","lì","jiē","xīn","kǔ"],translate:"正午烈日下农民给禾苗锄草，汗水滴落在禾苗下的泥土里。有谁知道盘中的饭食，每一粒都饱含农民的辛劳。",appreciation:"以朴素语言再现农民劳作之苦，'粒粒皆辛苦'劝人珍惜粮食。",authorIntro:"李绅（772-846），唐代诗人，新乐府运动倡导者之一。",tag:"感恩",emoji:"🌾"},
{n:5,title:"登鹳雀楼",author:"王之涣",dynasty:"唐",pinyin:"dēng guàn què lóu",content:"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。",pinyinChars:["bái","rì","yī","shān","jìn","huáng","hé","rù","hǎi","liú","yù","qióng","qiān","lǐ","mù","gèng","shàng","yī","céng","lóu"],translate:"夕阳依傍着西山缓缓落下，黄河水向着大海奔流不息。想要看到千里之外的风景，就要再登上一层楼。",appreciation:"前两句写壮阔景象，后两句蕴含'站得高才能看得远'的哲理，气势磅礴。",authorIntro:"王之涣（688-742），唐代诗人，以边塞诗见长。",tag:"励志",emoji:"🏯"},
{n:6,title:"望庐山瀑布",author:"李白",dynasty:"唐",pinyin:"wàng lú shān pù bù",content:"日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。",pinyinChars:["rì","zhào","xiāng","lú","shēng","zǐ","yān","yáo","kàn","pù","bù","guà","qián","chuān","fēi","liú","zhí","xià","sān","qiān","chǐ","yí","shì","yín","hé","luò","jiǔ","tiān"],translate:"阳光照耀香炉峰升起紫色烟霞，远远望见瀑布像白绢挂在山前。飞流直下足有三千尺，怀疑是银河从九天倾泻而下。",appreciation:"以'飞流直下三千尺'的夸张与'银河落九天'的奇想，写出庐山瀑布的雄伟壮观。",authorIntro:"李白（701-762），唐代伟大诗人，被誉为'诗仙'。",tag:"山水",emoji:"🏞️"},
{n:7,title:"早发白帝城",author:"李白",dynasty:"唐",pinyin:"zǎo fā bái dì chéng",content:"朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。",pinyinChars:["zhāo","cí","bái","dì","cǎi","yún","jiān","qiān","lǐ","jiāng","líng","yī","rì","huán","liǎng","àn","yuán","shēng","tí","bù","zhù","qīng","zhōu","yǐ","guò","wàn","chóng","shān"],translate:"清晨告别彩云环绕的白帝城，千里之外的江陵一天即可返回。两岸猿猴啼叫声声不断，轻快的小船已穿过万重山峦。",appreciation:"写于李白遇赦东归途中，'轻舟已过万重山'既写船行之快，也暗喻心境的轻松豁达。",authorIntro:"李白（701-762），唐代伟大诗人，诗风豪放飘逸。",tag:"山水",emoji:"📜"},
{n:8,title:"绝句",author:"杜甫",dynasty:"唐",pinyin:"jué jù",content:"两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。",pinyinChars:["liǎng","gè","huáng","lí","míng","cuì","liǔ","yī","háng","bái","lù","shàng","qīng","tiān","chuāng","hán","xī","lǐng","qiān","qiū","xuě","mén","bó","dōng","wú","wàn","lǐ","chuán"],translate:"两只黄鹂在翠柳间鸣唱，一行白鹭飞上蓝天。窗口映着西岭千年不化的积雪，门前停泊着驶向东吴的万里客船。",appreciation:"四句诗如四幅画，色彩明丽，动静相宜，寄寓思乡之情。",authorIntro:"杜甫（712-770），唐代伟大现实主义诗人，被尊为'诗圣'。",tag:"春天",emoji:"📜"},
{n:9,title:"江雪",author:"柳宗元",dynasty:"唐",pinyin:"jiāng xuě",content:"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。",pinyinChars:["qiān","shān","niǎo","fēi","jué","wàn","jìng","rén","zōng","miè","gū","zhōu","suō","lì","wēng","dú","diào","hán","jiāng","xuě"],translate:"群山中飞鸟绝迹，万条小路上人迹消失。孤零零一只小舟上，披蓑戴笠的老翁，独自在寒冷的江雪中垂钓。",appreciation:"以'千山''万径'的空旷衬托'孤舟''独钓'的孤傲，意境冷峻清高。",authorIntro:"柳宗元（773-819），唐代文学家，'唐宋八大家'之一。",tag:"冬天",emoji:"❄️"},
{n:10,title:"渔歌子",author:"张志和",dynasty:"唐",pinyin:"yú gē zǐ",content:"西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。",pinyinChars:["xī","sài","shān","qián","bái","lù","fēi","táo","huā","liú","shuǐ","guì","yú","féi","qīng","ruò","lì","lǜ","suō","yī","xié","fēng","xì","yǔ","bù","xū","guī"],translate:"西塞山前白鹭自由飞翔，桃花飘落春水鳜鱼肥美。头戴青竹笠，身披绿蓑衣，斜风细雨中不愿归家。",appreciation:"词中有画，画中有诗，渔翁形象超然物外，意境悠然。",authorIntro:"张志和（732-774），唐代诗人，自号'烟波钓徒'。",tag:"山水",emoji:"📜"},
{n:11,title:"游子吟",author:"孟郊",dynasty:"唐",pinyin:"yóu zǐ yín",content:"慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。",pinyinChars:["cí","mǔ","shǒu","zhōng","xiàn","yóu","zǐ","shēn","shàng","yī","lín","xíng","mì","mì","féng","yì","kǒng","chí","chí","guī","shuí","yán","cùn","cǎo","xīn","bào","dé","sān","chūn","huī"],translate:"慈母手中的针线，缝成游子身上的衣裳。临行前密密地缝制，担心儿子迟迟不归。谁说小草的心意，能报答得了春天的阳光？",appreciation:"以'寸草心'喻子女，'三春晖'喻母爱，比喻贴切，是歌颂母爱的千古名篇。",authorIntro:"孟郊（751-814），唐代诗人，与贾岛并称'郊寒岛瘦'。",tag:"感恩",emoji:"🧵"},
{n:12,title:"九月九日忆山东兄弟",author:"王维",dynasty:"唐",pinyin:"jiǔ yuè jiǔ rì yì shān dōng xiōng dì",content:"独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。",pinyinChars:["dú","zài","yì","xiāng","wéi","yì","kè","měi","féng","jiā","jié","bèi","sī","qīn","yáo","zhī","xiōng","dì","dēng","gāo","chù","biàn","chā","zhū","yú","shǎo","yī","rén"],translate:"独自漂泊他乡成为异乡客，每到佳节加倍思念亲人。遥想兄弟们登高的地方，都插着茱萸唯独少了我一人。",appreciation:"'每逢佳节倍思亲'道尽游子心声，'少一人'的细节写出遥念之情。",authorIntro:"王维（701-761），唐代诗人、画家，苏轼赞其'诗中有画'。",tag:"思乡",emoji:"🏔️"},
{n:13,title:"咏柳",author:"贺知章",dynasty:"唐",pinyin:"yǒng liǔ",content:"碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。",pinyinChars:["bì","yù","zhuāng","chéng","yī","shù","gāo","wàn","tiáo","chuí","xià","lǜ","sī","tāo","bù","zhī","xì","yè","shuí","cái","chū","èr","yuè","chūn","fēng","sì","jiǎn","dāo"],translate:"高高的柳树像用碧玉装扮而成，万千柳条垂下如绿色丝带。不知这细嫩的柳叶是谁裁出？二月的春风就像一把剪刀。",appreciation:"'二月春风似剪刀'想象新奇，把春风拟人化。",authorIntro:"贺知章（659-744），唐代诗人，自号'四明狂客'。",tag:"咏物",emoji:"🌳"},
{n:14,title:"出塞",author:"王昌龄",dynasty:"唐",pinyin:"chū sài",content:"秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。",pinyinChars:["qín","shí","míng","yuè","hàn","shí","guān","wàn","lǐ","cháng","zhēng","rén","wèi","huán","dàn","shǐ","lóng","chéng","fēi","jiàng","zài","bù","jiào","hú","mǎ","dù","yīn","shān"],translate:"秦汉时的明月与边关依旧，万里长征的将士尚未归还。只要有龙城飞将李广在，绝不让胡马越过阴山。",appreciation:"被誉为唐人七绝压卷之作，'秦时明月汉时关'跨越千年时空。",authorIntro:"王昌龄（698-757），唐代诗人，被誉为'七绝圣手'。",tag:"边塞",emoji:"🏰"},
{n:15,title:"芙蓉楼送辛渐",author:"王昌龄",dynasty:"唐",pinyin:"fú róng lóu sòng xīn jiàn",content:"寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。",pinyinChars:["hán","yǔ","lián","jiāng","yè","rù","wú","píng","míng","sòng","kè","chǔ","shān","gū","luò","yáng","qīn","yǒu","rú","xiāng","wèn","yī","piàn","bīng","xīn","zài","yù","hú"],translate:"寒雨连夜洒满江面来到吴地，清晨送别友人只余楚山孤影。洛阳亲友若问起我，就说我的心像玉壶中的冰一样纯洁。",appreciation:"'一片冰心在玉壶'以冰喻志，表达诗人虽遭贬谪却依然清白高洁的品格。",authorIntro:"王昌龄（698-757），唐代诗人，擅写边塞与送别。",tag:"送别",emoji:"🌧️"},
{n:16,title:"鹿柴",author:"王维",dynasty:"唐",pinyin:"lù zhài",content:"空山不见人，但闻人语响。返景入深林，复照青苔上。",pinyinChars:["kōng","shān","bù","jiàn","rén","dàn","wén","rén","yǔ","xiǎng","fǎn","yǐng","rù","shēn","lín","fù","zhào","qīng","tái","shàng"],translate:"空旷的山中看不见人影，只听到人说话的回响。夕阳的余晖照入深林，又映照在青苔之上。",appreciation:"以'空山''人语'写出山的幽静，'返景''青苔'描绘光影之美，禅意悠远。",authorIntro:"王维（701-761），唐代诗人，山水田园诗派代表。",tag:"田园",emoji:"🦌"},
{n:17,title:"送元二使安西",author:"王维",dynasty:"唐",pinyin:"sòng yuán èr shǐ ān xī",content:"渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。",pinyinChars:["wèi","chéng","zhāo","yǔ","yì","qīng","chén","kè","shè","qīng","qīng","liǔ","sè","xīn","quàn","jūn","gèng","jìn","yī","bēi","jiǔ","xī","chū","yáng","guān","wú","gù","rén"],translate:"渭城清晨的雨洒湿了轻尘，客舍旁柳色青青焕然一新。劝你再饮尽这一杯酒，西出阳关就没有老朋友了。",appreciation:"'劝君更尽一杯酒'成为送别名句，情深意长。",authorIntro:"王维（701-761），唐代诗人，意境空灵。",tag:"送别",emoji:"🍵"},
{n:18,title:"望天门山",author:"李白",dynasty:"唐",pinyin:"wàng tiān mén shān",content:"天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。",pinyinChars:["tiān","mén","zhōng","duàn","chǔ","jiāng","kāi","bì","shuǐ","dōng","liú","zhì","cǐ","huí","liǎng","àn","qīng","shān","xiāng","duì","chū","gū","fān","yī","piàn","rì","biān","lái"],translate:"天门山被楚江从中劈开，碧水东流到这里回旋。两岸青山相对挺立，一片孤帆从日边驶来。",appreciation:"'中断''开''回'写出江水冲山的气势，'相对出''日边来'赋予山水以动感。",authorIntro:"李白（701-762），唐代伟大诗人，诗风雄奇豪放。",tag:"山水",emoji:"⛰️"},
{n:19,title:"赠汪伦",author:"李白",dynasty:"唐",pinyin:"zèng wāng lún",content:"李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。",pinyinChars:["lǐ","bái","chéng","zhōu","jiāng","yù","xíng","hū","wén","àn","shàng","tà","gē","shēng","táo","huā","tán","shuǐ","shēn","qiān","chǐ","bù","jí","wāng","lún","sòng","wǒ","qíng"],translate:"李白刚登上船将要出发，忽然听到岸上有人踏歌相送。桃花潭的水纵然深千尺，也比不上汪伦送我的情谊深。",appreciation:"以'千尺'潭水衬托友情之深，比喻新颖，语言质朴而情真意切。",authorIntro:"李白（701-762），唐代诗人，与汪伦的友谊传为佳话。",tag:"送别",emoji:"👋"},
{n:20,title:"黄鹤楼送孟浩然之广陵",author:"李白",dynasty:"唐",pinyin:"huáng hè lóu sòng mèng hào rán zhī guǎng líng",content:"故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。",pinyinChars:["gù","rén","xī","cí","huáng","hè","lóu","yān","huā","sān","yuè","xià","yáng","zhōu","gū","fān","yuǎn","yǐng","bì","kōng","jìn","wéi","jiàn","cháng","jiāng","tiān","jì","liú"],translate:"老朋友在黄鹤楼与我辞别，烟花三月他要东下扬州。孤帆远去的影子消失在碧空尽头，只见长江水向天际奔流。",appreciation:"'烟花三月'写出送别时节之美，'孤帆远影''长江天际'写出别后的怅惘。",authorIntro:"李白（701-762），唐代诗人，与孟浩然亦师亦友。",tag:"送别",emoji:"⛵"},
{n:21,title:"登高",author:"杜甫",dynasty:"唐",pinyin:"dēng gāo",content:"风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。",pinyinChars:["fēng","jí","tiān","gāo","yuán","xiào","āi","zhǔ","qīng","shā","bái","niǎo","fēi","huí","wú","biān","luò","mù","xiāo","xiāo","xià","bù","jìn","cháng","jiāng","gǔn","gǔn","lái"],translate:"风急天高猿猴哀鸣，水清沙白鸟儿盘旋。无边无际的落叶萧萧而下，奔流不尽的长江滚滚而来。",appreciation:"被誉为'古今七律第一'，'无边落木''不尽长江'气象宏阔。",authorIntro:"杜甫（712-770），唐代伟大诗人，诗风沉郁顿挫。",tag:"秋天",emoji:"🍂"},
{n:22,title:"春望",author:"杜甫",dynasty:"唐",pinyin:"chūn wàng",content:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。",pinyinChars:["guó","pò","shān","hé","zài","chéng","chūn","cǎo","mù","shēn","gǎn","shí","huā","jiàn","lèi","hèn","bié","niǎo","jīng","xīn","fēng","huǒ","lián","sān","yuè","jiā","shū","dǐ","wàn","jīn"],translate:"国都残破只有山河依旧，长安城春天草木丛生。感伤时事花儿也落泪，怨恨离别鸟鸣也惊心。战火连续三个月，一封家书抵得上万金。",appreciation:"'国破山河在'写尽沧桑，'家书抵万金'道出战乱中亲情的珍贵。",authorIntro:"杜甫（712-770），唐代伟大现实主义诗人，被尊为'诗圣'。",tag:"忧国",emoji:"🌸"},
{n:23,title:"江南春",author:"杜牧",dynasty:"唐",pinyin:"jiāng nán chūn",content:"千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。",pinyinChars:["qiān","lǐ","yīng","tí","lǜ","yìng","hóng","shuǐ","cūn","shān","guō","jiǔ","qí","fēng","nán","cháo","sì","bǎi","bā","shí","sì","duō","shǎo","lóu","tái","yān","yǔ","zhōng"],translate:"千里江南莺啼燕语绿映红，水乡山村酒旗随风飘动。南朝四百八十座古寺，多少楼台掩映在蒙蒙烟雨中。",appreciation:"'千里'写出江南之广阔，'烟雨中'朦胧迷离，今昔对比，意境深远。",authorIntro:"杜牧（803-852），唐代诗人，与李商隐并称'小李杜'。",tag:"春天",emoji:"🌿"},
{n:24,title:"清明",author:"杜牧",dynasty:"唐",pinyin:"qīng míng",content:"清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。",pinyinChars:["qīng","míng","shí","jié","yǔ","fēn","fēn","lù","shàng","xíng","rén","yù","duàn","hún","jiè","wèn","jiǔ","jiā","hé","chù","yǒu","mù","tóng","yáo","zhǐ","xìng","huā","cūn"],translate:"清明时节细雨纷纷飘洒，路上行人伤感失魂。借问哪里有酒家？牧童遥指远处的杏花村。",appreciation:"'欲断魂'三字写出清明的哀思，'杏花村'的结尾留下悠长余韵。",authorIntro:"杜牧（803-852），唐代诗人，诗风清丽俊爽。",tag:"春天",emoji:"🌧️"},
{n:25,title:"山行",author:"杜牧",dynasty:"唐",pinyin:"shān xíng",content:"远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。",pinyinChars:["yuǎn","shàng","hán","shān","shí","jìng","xié","bái","yún","shēng","chù","yǒu","rén","jiā","tíng","chē","zuò","ài","fēng","lín","wǎn","shuāng","yè","hóng","yú","èr","yuè","huā"],translate:"沿着弯弯的石径登上寒山，白云生处竟有人家。停下马车只因喜爱枫林的晚景，经霜的枫叶比二月的春花还红。",appreciation:"'霜叶红于二月花'是千古名句，以秋叶胜春花，写出深秋的热烈。",authorIntro:"杜牧（803-852），唐代诗人，擅写咏史与抒情小诗。",tag:"秋天",emoji:"🍁"},
{n:26,title:"秋夕",author:"杜牧",dynasty:"唐",pinyin:"qiū xī",content:"银烛秋光冷画屏，轻罗小扇扑流萤。天阶夜色凉如水，卧看牵牛织女星。",pinyinChars:["yín","zhú","qiū","guāng","lěng","huà","píng","qīng","luó","xiǎo","shàn","pū","liú","yíng","tiān","jiē","yè","sè","liáng","rú","shuǐ","wò","kàn","qiān","niú","zhī","nǚ","xīng"],translate:"银烛秋光照冷了画屏，手执轻罗小扇扑打流萤。宫中夜色凉如水，卧看天上的牵牛织女星。",appreciation:"写宫女秋夜的孤寂无聊，'凉如水'既写夜色也写心境。",authorIntro:"杜牧（803-852），唐代诗人，长于抒情。",tag:"秋天",emoji:"🌠"},
{n:27,title:"悯农其二",author:"李绅",dynasty:"唐",pinyin:"mǐn nóng qí èr",content:"春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。",pinyinChars:["chūn","zhòng","yī","lì","sù","qiū","shōu","wàn","kē","zǐ","sì","hǎi","wú","xián","tián","nóng","fū","yóu","è","sǐ"],translate:"春天播下一粒粟种，秋天收获万颗粮食。四海之内没有闲置的田地，农夫却仍有可能饿死。",appreciation:"以'种''收'对比写出丰收，'犹饿死'揭露赋税沉重，发人深省。",authorIntro:"李绅（772-846），唐代诗人，新乐府运动倡导者。",tag:"感恩",emoji:"🌾"},
{n:28,title:"元日",author:"王安石",dynasty:"北宋",pinyin:"yuán rì",content:"爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。",pinyinChars:["bào","zhú","shēng","zhōng","yī","suì","chú","chūn","fēng","sòng","nuǎn","rù","tú","sū","qiān","mén","wàn","hù","tóng","tóng","rì","zǒng","bǎ","xīn","táo","huàn","jiù","fú"],translate:"爆竹声中旧的一年过去，春风送暖人们饮屠苏酒。千家万户沐浴着初升的太阳，都要把新的桃符换下旧的。",appreciation:"写春节的热闹与除旧迎新的喜悦，'千门万户曈曈日'气象开阔。",authorIntro:"王安石（1021-1086），北宋政治家、文学家，'唐宋八大家'之一。",tag:"春节",emoji:"🧨"},
{n:29,title:"泊船瓜洲",author:"王安石",dynasty:"北宋",pinyin:"bó chuán guā zhōu",content:"京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。",pinyinChars:["jīng","kǒu","guā","zhōu","yī","shuǐ","jiān","zhōng","shān","zhǐ","gé","shù","chóng","shān","chūn","fēng","yòu","lǜ","jiāng","nán","àn","míng","yuè","hé","shí","zhào","wǒ","huán"],translate:"京口与瓜洲只隔一条江，钟山也只隔几重山。春风又吹绿了江南岸，明月什么时候才能照着我回乡？",appreciation:"'春风又绿江南岸'的'绿'字用得极妙，化静为动，传诵千古。",authorIntro:"王安石（1021-1086），北宋文学家，'唐宋八大家'之一。",tag:"思乡",emoji:"🚢"},
{n:30,title:"梅花",author:"王安石",dynasty:"北宋",pinyin:"méi huā",content:"墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。",pinyinChars:["qiáng","jiǎo","shù","zhī","méi","líng","hán","dú","zì","kāi","yáo","zhī","bù","shì","xuě","wèi","yǒu","àn","xiāng","lái"],translate:"墙角有几枝梅花，冒着严寒独自开放。远远望去知道那不是雪，因为有淡淡的清香飘来。",appreciation:"以梅喻人，'凌寒独自开'写出梅的坚贞品格，'暗香'二字尤妙。",authorIntro:"王安石（1021-1086），北宋政治家、文学家。",tag:"咏物",emoji:"🌸"},
{n:31,title:"六月二十七日望湖楼醉书",author:"苏轼",dynasty:"北宋",pinyin:"liù yuè èr shí qī rì wàng hú lóu zuì shū",content:"黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。",pinyinChars:["hēi","yún","fān","mò","wèi","zhē","shān","bái","yǔ","tiào","zhū","luàn","rù","chuán","juǎn","dì","fēng","lái","hū","chuī","sàn","wàng","hú","lóu","xià","shuǐ","rú","tiān"],translate:"乌云像打翻的墨汁还没遮住山，白亮的雨点像珍珠乱跳入船。卷地风忽然吹散乌云，望湖楼下水面如天空般平静。",appreciation:"写夏日暴雨来得急去得快，'翻墨''跳珠'比喻生动。",authorIntro:"苏轼（1037-1101），字子瞻，号东坡居士，北宋文学巨匠。",tag:"夏天",emoji:"⛈️"},
{n:32,title:"饮湖上初晴后雨",author:"苏轼",dynasty:"北宋",pinyin:"yǐn hú shàng chū qíng hòu yǔ",content:"水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。",pinyinChars:["shuǐ","guāng","liàn","yàn","qíng","fāng","hǎo","shān","sè","kōng","méng","yǔ","yì","qí","yù","bǎ","xī","hú","bǐ","xī","zǐ","dàn","zhuāng","nóng","mǒ","zǒng","xiāng","yí"],translate:"晴天西湖水波荡漾格外美丽，雨天山色朦胧也很奇妙。要把西湖比作西施，淡妆浓抹都很相宜。",appreciation:"'欲把西湖比西子'的比喻千古传诵，写出西湖的恒久之美。",authorIntro:"苏轼（1037-1101），北宋文学家，'唐宋八大家'之一。",tag:"山水",emoji:"🏔️"},
{n:33,title:"题西林壁",author:"苏轼",dynasty:"北宋",pinyin:"tí xī lín bì",content:"横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。",pinyinChars:["héng","kàn","chéng","lǐng","cè","chéng","fēng","yuǎn","jìn","gāo","dī","gè","bù","tóng","bù","shí","lú","shān","zhēn","miàn","mù","zhǐ","yuán","shēn","zài","cǐ","shān","zhōng"],translate:"横看是山岭侧看是山峰，远近高低看到的景象各不相同。看不清庐山的真面目，只因为自己就身处这山之中。",appreciation:"'不识庐山真面目，只缘身在此山中'蕴含'当局者迷'的哲理。",authorIntro:"苏轼（1037-1101），北宋文学家，诗书画俱佳。",tag:"哲理",emoji:"⛰️"},
{n:34,title:"惠崇春江晚景",author:"苏轼",dynasty:"北宋",pinyin:"huì chóng chūn jiāng wǎn jǐng",content:"竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。",pinyinChars:["zhú","wài","táo","huā","sān","liǎng","zhī","chūn","jiāng","shuǐ","nuǎn","yā","xiān","zhī","lóu","hāo","mǎn","dì","lú","yá","duǎn","zhèng","shì","hé","tún","yù","shàng","shí"],translate:"竹林外两三枝桃花开放，春江水变暖鸭子最先感知。蒌蒿满地芦芽还短，正是河豚将要逆流而上的时候。",appreciation:"'春江水暖鸭先知'富有理趣，写出了春天的气息。",authorIntro:"苏轼（1037-1101），北宋文学家，多才多艺。",tag:"春天",emoji:"🦆"},
{n:35,title:"赠刘景文",author:"苏轼",dynasty:"北宋",pinyin:"zèng liú jǐng wén",content:"荷尽已无擎雨盖，菊残犹有傲霜枝。一年好景君须记，最是橙黄橘绿时。",pinyinChars:["hé","jìn","yǐ","wú","qíng","yǔ","gài","jú","cán","yóu","yǒu","ào","shuāng","zhī","yī","nián","hǎo","jǐng","jūn","xū","jì","zuì","shì","chéng","huáng","jú","lǜ","shí"],translate:"荷花谢了已没有擎雨的荷叶，菊花残了还有傲霜的枝条。一年的好景你要记住，正是橙子黄橘子绿的时候。",appreciation:"'最是橙黄橘绿时'写出初冬的丰硕之美，劝人珍惜时光。",authorIntro:"苏轼（1037-1101），北宋文学家，豁达乐观。",tag:"秋天",emoji:"📜"},
{n:36,title:"夏日绝句",author:"李清照",dynasty:"宋",pinyin:"xià rì jué jù",content:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。",pinyinChars:["shēng","dāng","zuò","rén","jié","sǐ","yì","wéi","guǐ","xióng","zhì","jīn","sī","xiàng","yǔ","bù","kěn","guò","jiāng","dōng"],translate:"活着就要做人中豪杰，死了也要做鬼中英雄。至今人们还思念项羽，他不肯忍辱回到江东。",appreciation:"借项羽宁死不辱的故事，表达诗人的爱国情怀与英雄气概。",authorIntro:"李清照（1084-1155），号易安居士，宋代女词人，婉约派代表。",tag:"励志",emoji:"⚔️"},
{n:37,title:"示儿",author:"陆游",dynasty:"南宋",pinyin:"shì ér",content:"死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。",pinyinChars:["sǐ","qù","yuán","zhī","wàn","shì","kōng","dàn","bēi","bù","jiàn","jiǔ","zhōu","tóng","wáng","shī","běi","dìng","zhōng","yuán","rì","jiā","jì","wú","wàng","gào","nǎi","wēng"],translate:"死去了原本知道万事皆空，只悲叹没能看到九州统一。宋朝军队北定中原的那天，家祭时别忘了告诉你的父亲。",appreciation:"这是陆游的绝笔诗，至死不忘收复失地，爱国之情令人动容。",authorIntro:"陆游（1125-1210），字务观，号放翁，南宋爱国诗人。",tag:"忧国",emoji:"📜"},
{n:38,title:"秋夜将晓出篱门迎凉有感",author:"陆游",dynasty:"南宋",pinyin:"qiū yè jiāng xiǎo chū lí mén yíng liáng yǒu gǎn",content:"三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。",pinyinChars:["sān","wàn","lǐ","hé","dōng","rù","hǎi","wǔ","qiān","rèn","yuè","shàng","mó","tiān","yí","mín","lèi","jìn","hú","chén","lǐ","nán","wàng","wáng","shī","yòu","yī","nián"],translate:"三万里黄河东流入海，五千仞华山高耸入云。遗民的泪水在胡尘里流尽，向南盼望王师又过了一年。",appreciation:"写中原遗民的苦难与期盼，饱含忧国之情。",authorIntro:"陆游（1125-1210），南宋爱国诗人，一生主张抗金。",tag:"忧国",emoji:"📜"},
{n:39,title:"四时田园杂兴",author:"范成大",dynasty:"南宋",pinyin:"sì shí tián yuán zá xìng",content:"昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。",pinyinChars:["zhòu","chū","yún","tián","yè","jì","má","cūn","zhuāng","ér","nǚ","gè","dāng","jiā","tóng","sūn","wèi","jiě","gòng","gēng","zhī","yě","bàng","sāng","yīn","xué","zhòng","guā"],translate:"白天出去锄田夜晚搓麻线，村里的男女各自忙家务。小孙子还不会耕田织布，也在桑树荫下学着种瓜。",appreciation:"生动描绘农村生活场景，'学种瓜'的儿童形象天真可爱。",authorIntro:"范成大（1126-1193），南宋诗人，与陆游、杨万里齐名。",tag:"田园",emoji:"🌻"},
{n:40,title:"小池",author:"杨万里",dynasty:"南宋",pinyin:"xiǎo chí",content:"泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。",pinyinChars:["quán","yǎn","wú","shēng","xī","xì","liú","shù","yīn","zhào","shuǐ","ài","qíng","róu","xiǎo","hé","cái","lù","jiān","jiān","jiǎo","zǎo","yǒu","qīng","tíng","lì","shàng","tóu"],translate:"泉眼无声地珍惜着细流，树阴映在水中喜爱这晴柔。小小的荷叶刚露出尖尖的角，早有蜻蜓立在上面。",appreciation:"'小荷才露尖尖角'成为千古名句，富有生机与情趣。",authorIntro:"杨万里（1127-1206），字廷秀，号诚斋，南宋诗人。",tag:"夏天",emoji:"🪷"},
{n:41,title:"晓出净慈寺送林子方",author:"杨万里",dynasty:"南宋",pinyin:"xiǎo chū jìng cí sì sòng lín zǐ fāng",content:"毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。",pinyinChars:["bì","jìng","xī","hú","liù","yuè","zhōng","fēng","guāng","bù","yǔ","sì","shí","tóng","jiē","tiān","lián","yè","wú","qióng","bì","yìng","rì","hé","huā","bié","yàng","hóng"],translate:"毕竟是六月的西湖，风光与四季不同。碧绿的荷叶接天无尽，映着阳光的荷花格外红艳。",appreciation:"'接天莲叶无穷碧，映日荷花别样红'色彩浓烈，气象宏大。",authorIntro:"杨万里（1127-1206），南宋诗人，'中兴四大诗人'之一。",tag:"夏天",emoji:"🪷"},
{n:42,title:"春日",author:"朱熹",dynasty:"南宋",pinyin:"chūn rì",content:"胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。",pinyinChars:["shèng","rì","xún","fāng","sì","shuǐ","bīn","wú","biān","guāng","jǐng","yī","shí","xīn","děng","xián","shí","dé","dōng","fēng","miàn","wàn","zǐ","qiān","hóng","zǒng","shì","chūn"],translate:"在晴朗的日子寻芳于泗水之滨，无边无际的风光焕然一新。轻易就能识得东风的面目，万紫千红都是春。",appreciation:"'万紫千红总是春'写出春天的绚烂，蕴含理趣。",authorIntro:"朱熹（1130-1200），字元晦，南宋理学家、诗人。",tag:"春天",emoji:"🌸"},
{n:43,title:"观书有感",author:"朱熹",dynasty:"南宋",pinyin:"guān shū yǒu gǎn",content:"半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。",pinyinChars:["bàn","mǔ","fāng","táng","yī","jiàn","kāi","tiān","guāng","yún","yǐng","gòng","pái","huái","wèn","qú","nǎ","dé","qīng","rú","xǔ","wèi","yǒu","yuán","tóu","huó","shuǐ","lái"],translate:"半亩大的方形池塘像一面镜子打开，天光云影在水面上共徘徊。问它怎么会这样清澈？因为有源头活水不断流来。",appreciation:"'为有源头活水来'借景喻理，说明学习需要不断汲取新知。",authorIntro:"朱熹（1130-1200），南宋理学家，集理学之大成。",tag:"哲理",emoji:"📚"},
{n:44,title:"乡村四月",author:"翁卷",dynasty:"南宋",pinyin:"xiāng cūn sì yuè",content:"绿遍山原白满川，子规声里雨如烟。乡村四月闲人少，才了蚕桑又插田。",pinyinChars:["lǜ","biàn","shān","yuán","bái","mǎn","chuān","zǐ","guī","shēng","lǐ","yǔ","rú","yān","xiāng","cūn","sì","yuè","xián","rén","shǎo","cái","liǎo","cán","sāng","yòu","chā","tián"],translate:"绿草遍山原白水满川，子规啼叫中细雨如烟。乡村四月闲人很少，刚忙完蚕桑又要插田。",appreciation:"写江南四月农忙景象，'雨如烟'朦胧如画。",authorIntro:"翁卷（生卒年不详），字续古，南宋诗人。",tag:"田园",emoji:"📜"},
{n:45,title:"石灰吟",author:"于谦",dynasty:"明",pinyin:"shí huī yín",content:"千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。",pinyinChars:["qiān","chuí","wàn","záo","chū","shēn","shān","liè","huǒ","fén","shāo","ruò","děng","xián","fěn","gǔ","suì","shēn","hún","bù","pà","yào","liú","qīng","bái","zài","rén","jiān"],translate:"经过千锤万凿才从深山开采出来，烈火焚烧也等闲视之。粉身碎骨全不怕，要把清白留在人间。",appreciation:"以石灰自喻，表达诗人宁折不弯、坚守清白的高尚品格。",authorIntro:"于谦（1398-1457），字廷益，明代政治家、诗人。",tag:"咏物",emoji:"🪨"},
{n:46,title:"竹石",author:"郑燮",dynasty:"清",pinyin:"zhú shí",content:"咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。",pinyinChars:["yǎo","dìng","qīng","shān","bù","fàng","sōng","lì","gēn","yuán","zài","pò","yán","zhōng","qiān","mó","wàn","jī","hái","jiān","jìng","rèn","ěr","dōng","xī","nán","běi","fēng"],translate:"紧紧咬住青山毫不放松，根扎在破裂的岩石之中。历经千磨万击依然坚韧，任凭东西南北风。",appreciation:"以竹喻人，写竹的坚韧刚劲，喻人的刚正不阿。",authorIntro:"郑燮（1693-1765），字克柔，号板桥，清代书画家、诗人。",tag:"咏物",emoji:"🎋"},
{n:47,title:"己亥杂诗",author:"龚自珍",pinyin:"jǐ hài zá shī",content:"九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。",pinyinChars:["jiǔ","zhōu","shēng","qì","shì","fēng","léi","wàn","mǎ","qí","yīn","jiū","kě","āi","wǒ","quàn","tiān","gōng","chóng","dǒu","sǒu","bù","jū","yī","gé","jiàng","rén","cái"],translate:"九州的生气要靠风雷激荡，万马齐喑的局面实在可哀。我劝天公重新振作精神，不拘一格降下人才。",appreciation:"借'风雷'喻变革，呼吁打破束缚、广纳人才。",authorIntro:"龚自珍（1792-1841），字璱人，清末思想家、诗人。",tag:"励志",emoji:"⚡"},
{n:48,title:"所见",author:"袁枚",dynasty:"清",pinyin:"suǒ jiàn",content:"牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。",pinyinChars:["mù","tóng","qí","huáng","niú","gē","shēng","zhèn","lín","yuè","yì","yù","bǔ","míng","chán","hū","rán","bì","kǒu","lì"],translate:"牧童骑着黄牛，歌声振动林间。想捕捉鸣叫的蝉，忽然闭口站立不动。",appreciation:"写牧童的天真活泼，'忽然闭口立'传神有趣。",authorIntro:"袁枚（1716-1797），字子才，号简斋，清代诗人。",tag:"田园",emoji:"🐂"},
{n:49,title:"村居",author:"高鼎",dynasty:"清",pinyin:"cūn jū",content:"草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。",pinyinChars:["cǎo","zhǎng","yīng","fēi","èr","yuè","tiān","fú","dī","yáng","liǔ","zuì","chūn","yān","ér","tóng","sàn","xué","guī","lái","zǎo","máng","chèn","dōng","fēng","fàng","zhǐ","yuān"],translate:"二月里草长莺飞，杨柳轻拂堤岸沉醉在春烟中。孩子们放学回来得早，忙着趁东风放风筝。",appreciation:"写春日乡村的生机与童趣，'醉春烟'三字尤为传神。",authorIntro:"高鼎（生卒年不详），字象一，清代诗人。",tag:"春天",emoji:"🪁"},
{n:50,title:"回乡偶书",author:"贺知章",dynasty:"唐",pinyin:"huí xiāng ǒu shū",content:"少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。",pinyinChars:["shào","xiǎo","lí","jiā","lǎo","dà","huí","xiāng","yīn","wú","gǎi","bìn","máo","shuāi","ér","tóng","xiāng","jiàn","bù","xiāng","shí","xiào","wèn","kè","cóng","hé","chù","lái"],translate:"年少离家年老才回，乡音未改鬓毛已稀疏。孩子们相见不认识，笑着问客人从哪里来。",appreciation:"'笑问客从何处来'写出久客伤老的复杂心情，含蓄深沉。",authorIntro:"贺知章（659-744），唐代诗人，自号'四明狂客'。",tag:"思乡",emoji:"🏠"},
{n:51,title:"七步诗",author:"曹植",dynasty:"三国",pinyin:"qī bù shī",content:"煮豆燃豆萁，豆在釜中泣。本是同根生，相煎何太急？",pinyinChars:["zhǔ","dòu","rán","dòu","qí","dòu","zài","fǔ","zhōng","qì","běn","shì","tóng","gēn","shēng","xiāng","jiān","hé","tài","jí"],translate:"煮豆子燃烧豆秸，豆子在锅里哭泣。本是同根所生，相煎何必太急？",appreciation:"借煮豆喻兄弟相残，'相煎何太急'质问有力，情真意切。",authorIntro:"曹植（192-232），字子建，三国魏诗人，曹操之子。",tag:"哲理",emoji:"🫘"},
{n:52,title:"敕勒歌",author:"北朝民歌",dynasty:"北朝",pinyin:"chì lè gē",content:"敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。",pinyinChars:["chì","lè","chuān","yīn","shān","xià","tiān","sì","qióng","lú","lóng","gài","sì","yě","tiān","cāng","cāng","yě","máng","máng","fēng","chuī","cǎo","dī","xiàn","niú","yáng"],translate:"敕勒川在阴山脚下。天像圆顶帐篷笼罩着四野。天色苍苍，原野茫茫，风吹草低显现出牛羊。",appreciation:"'风吹草低见牛羊'写出草原的辽阔与富饶，气象宏大。",authorIntro:"北朝民歌，作者不详，反映北方游牧民族生活。",tag:"边塞",emoji:"📜"},
{n:53,title:"送杜少府之任蜀州",author:"王勃",dynasty:"唐",pinyin:"sòng dù shào fǔ zhī rèn shǔ zhōu",content:"城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。",pinyinChars:["chéng","què","fǔ","sān","qín","fēng","yān","wàng","wǔ","jīn","yǔ","jūn","lí","bié","yì","tóng","shì","huàn","yóu","rén","hǎi","nèi","cún","zhī","jǐ","tiān","yá","ruò","bǐ","lín"],translate:"三秦护卫着长安城，风烟中遥望五津。与你离别的心情，我们同是宦游在外的人。海内有知己，天涯也如比邻。",appreciation:"'海内存知己，天涯若比邻'气度豁达，成为送别名句。",authorIntro:"王勃（650-676），字子安，唐代诗人，'初唐四杰'之一。",tag:"送别",emoji:"🐎"},
{n:54,title:"登幽州台歌",author:"陈子昂",dynasty:"唐",pinyin:"dēng yōu zhōu tái gē",content:"前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。",pinyinChars:["qián","bù","jiàn","gǔ","rén","hòu","bù","jiàn","lái","zhě","niàn","tiān","dì","zhī","yōu","yōu","dú","chuàng","rán","ér","tì","xià"],translate:"前看不到古人，后看不到来者。想到天地之大悠悠无尽，独自悲伤地流下眼泪。",appreciation:"写诗人怀才不遇的孤独与感慨，气魄宏大。",authorIntro:"陈子昂（659-700），字伯玉，唐代诗人。",tag:"怀古",emoji:"🏔️"},
{n:55,title:"凉州词",author:"王翰",dynasty:"唐",pinyin:"liáng zhōu cí",content:"葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回？",pinyinChars:["pú","táo","měi","jiǔ","yè","guāng","bēi","yù","yǐn","pí","pá","mǎ","shàng","cuī","zuì","wò","shā","chǎng","jūn","mò","xiào","gǔ","lái","zhēng","zhàn","jǐ","rén","huí"],translate:"美酒斟满夜光杯，刚要饮琵琶声催人上马。醉倒在沙场请别笑，古来征战有几人能回？",appreciation:"'醉卧沙场君莫笑'豪迈中含悲凉，写出将士的复杂心境。",authorIntro:"王翰（687-726），字子羽，唐代诗人。",tag:"边塞",emoji:"🏜️"},
{n:56,title:"凉州词",author:"王之涣",dynasty:"唐",pinyin:"liáng zhōu cí",content:"黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。",pinyinChars:["huáng","hé","yuǎn","shàng","bái","yún","jiān","yī","piàn","gū","chéng","wàn","rèn","shān","qiāng","dí","hé","xū","yuàn","yáng","liǔ","chūn","fēng","bù","dù","yù","mén","guān"],translate:"黄河远远上溯到白云之间，孤城矗立在万仞山中。羌笛何必怨恨杨柳，春风吹不到玉门关。",appreciation:"'春风不度玉门关'写出边塞的荒凉与戍卒的思乡。",authorIntro:"王之涣（688-742），唐代诗人，以边塞诗著称。",tag:"边塞",emoji:"🏜️"},
{n:57,title:"从军行",author:"王昌龄",dynasty:"唐",pinyin:"cóng jūn xíng",content:"青海长云暗雪山，孤城遥望玉门关。黄沙百战穿金甲，不破楼兰终不还。",pinyinChars:["qīng","hǎi","cháng","yún","àn","xuě","shān","gū","chéng","yáo","wàng","yù","mén","guān","huáng","shā","bǎi","zhàn","chuān","jīn","jiǎ","bù","pò","lóu","lán","zhōng","bù","huán"],translate:"青海上空长云遮暗雪山，孤城遥遥望着玉门关。黄沙中百战磨穿了金甲，不打败楼兰誓不回还。",appreciation:"'不破楼兰终不还'写出将士的豪情壮志。",authorIntro:"王昌龄（698-757），唐代诗人，被誉为'七绝圣手'。",tag:"边塞",emoji:"⚔️"},
{n:58,title:"竹里馆",author:"王维",dynasty:"唐",pinyin:"zhú lǐ guǎn",content:"独坐幽篁里，弹琴复长啸。深林人不知，明月来相照。",pinyinChars:["dú","zuò","yōu","huáng","lǐ","tán","qín","fù","cháng","xiào","shēn","lín","rén","bù","zhī","míng","yuè","lái","xiāng","zhào"],translate:"独自坐在幽深的竹林里，弹琴又长啸。深林中无人知晓，只有明月来相照。",appreciation:"写隐居生活的闲适与孤独，'明月来相照'意境清幽。",authorIntro:"王维（701-761），唐代诗人，山水田园诗派代表。",tag:"田园",emoji:"🎋"},
{n:59,title:"相思",author:"王维",dynasty:"唐",pinyin:"xiāng sī",content:"红豆生南国，春来发几枝。愿君多采撷，此物最相思。",pinyinChars:["hóng","dòu","shēng","nán","guó","chūn","lái","fā","jǐ","zhī","yuàn","jūn","duō","cǎi","xié","cǐ","wù","zuì","xiāng","sī"],translate:"红豆生长在南方，春天来了发了几枝？愿你多采摘一些，这东西最代表相思。",appreciation:"借红豆寄托相思，'最相思'三字情深意长。",authorIntro:"王维（701-761），唐代诗人，诗画兼擅。",tag:"思乡",emoji:"📜"},
{n:60,title:"杂诗",author:"王维",dynasty:"唐",pinyin:"zá shī",content:"君自故乡来，应知故乡事。来日绮窗前，寒梅著花未？",pinyinChars:["jūn","zì","gù","xiāng","lái","yīng","zhī","gù","xiāng","shì","lái","rì","qǐ","chuāng","qián","hán","méi","zhuó","huā","wèi"],translate:"你从故乡来，应该知道故乡的事。来时窗前的梅花，开花了没有？",appreciation:"以问梅花开未寄托思乡之情，含蓄隽永。",authorIntro:"王维（701-761），唐代诗人，意境空灵。",tag:"思乡",emoji:"🌸"},
{n:61,title:"鸟鸣涧",author:"王维",dynasty:"唐",pinyin:"niǎo míng jiàn",content:"人闲桂花落，夜静春山空。月出惊山鸟，时鸣春涧中。",pinyinChars:["rén","xián","guì","huā","luò","yè","jìng","chūn","shān","kōng","yuè","chū","jīng","shān","niǎo","shí","míng","chūn","jiàn","zhōng"],translate:"人闲静时桂花飘落，夜静的春山空旷。月亮升起惊动山鸟，不时在春涧中鸣叫。",appreciation:"以动衬静，'月出惊山鸟'写出春夜的幽静。",authorIntro:"王维（701-761），唐代诗人，诗中有画。",tag:"春天",emoji:"🐦"},
{n:62,title:"古朗月行",author:"李白",dynasty:"唐",pinyin:"gǔ lǎng yuè xíng",content:"小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。",pinyinChars:["xiǎo","shí","bù","shí","yuè","hū","zuò","bái","yù","pán","yòu","yí","yáo","tái","jìng","fēi","zài","qīng","yún","duān"],translate:"小时候不认识月亮，把它叫做白玉盘。又怀疑是瑶台的镜子，飞在青云之上。",appreciation:"以儿童口吻写月，想象天真，富有童趣。",authorIntro:"李白（701-762），唐代伟大诗人，被誉为'诗仙'。",tag:"咏物",emoji:"📜"},
{n:63,title:"独坐敬亭山",author:"李白",dynasty:"唐",pinyin:"dú zuò jìng tíng shān",content:"众鸟高飞尽，孤云独去闲。相看两不厌，只有敬亭山。",pinyinChars:["zhòng","niǎo","gāo","fēi","jìn","gū","yún","dú","qù","xián","xiāng","kàn","liǎng","bù","yàn","zhǐ","yǒu","jìng","tíng","shān"],translate:"众鸟高高飞尽，孤云独自悠闲离去。彼此相看两不厌倦的，只有敬亭山。",appreciation:"写诗人的孤独与山水的默契，'相看两不厌'拟人传神。",authorIntro:"李白（701-762），唐代伟大诗人，诗风飘逸。",tag:"山水",emoji:"⛰️"},
{n:64,title:"春思",author:"李白",dynasty:"唐",pinyin:"chūn sī",content:"燕草如碧丝，秦桑低绿枝。当君怀归日，是妾断肠时。",pinyinChars:["yàn","cǎo","rú","bì","sī","qín","sāng","dī","lǜ","zhī","dāng","jūn","huái","guī","rì","shì","qiè","duàn","cháng","shí"],translate:"燕地的草像碧绿的丝，秦地的桑树垂下绿枝。当你怀归的日子，正是我断肠的时候。",appreciation:"写思妇对远人的思念，'断肠时'情真意切。",authorIntro:"李白（701-762），唐代伟大诗人，擅写多种题材。",tag:"思乡",emoji:"🌱"},
{n:65,title:"逢雪宿芙蓉山主人",author:"刘长卿",dynasty:"唐",pinyin:"féng xuě sù fú róng shān zhǔ rén",content:"日暮苍山远，天寒白屋贫。柴门闻犬吠，风雪夜归人。",pinyinChars:["rì","mù","cāng","shān","yuǎn","tiān","hán","bái","wū","pín","chái","mén","wén","quǎn","fèi","fēng","xuě","yè","guī","rén"],translate:"日暮时分苍山遥远，天寒地冻白屋贫寒。柴门外听到犬吠，是风雪夜归的人。",appreciation:"'风雪夜归人'画面感强，写出冬夜投宿的情景。",authorIntro:"刘长卿（709-780），字文房，唐代诗人。",tag:"冬天",emoji:"🌨️"},
{n:66,title:"塞下曲",author:"卢纶",dynasty:"唐",pinyin:"sài xià qǔ",content:"月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。",pinyinChars:["yuè","hēi","yàn","fēi","gāo","chán","yú","yè","dùn","táo","yù","jiāng","qīng","qí","zhú","dà","xuě","mǎn","gōng","dāo"],translate:"月黑风高大雁高飞，单于趁夜逃跑。要率轻骑追击，大雪落满了弓刀。",appreciation:"'大雪满弓刀'写出边塞的苦寒与将士的勇猛。",authorIntro:"卢纶（739-799），字允言，唐代诗人，'大历十才子'之一。",tag:"边塞",emoji:"🏹"},
{n:67,title:"滁州西涧",author:"韦应物",dynasty:"唐",pinyin:"chú zhōu xī jiàn",content:"独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。",pinyinChars:["dú","lián","yōu","cǎo","jiàn","biān","shēng","shàng","yǒu","huáng","lí","shēn","shù","míng","chūn","cháo","dài","yǔ","wǎn","lái","jí","yě","dù","wú","rén","zhōu","zì","héng"],translate:"独爱涧边生长的幽草，树深处有黄鹂鸣叫。春潮带雨傍晚来得急，野渡无人小船独自横着。",appreciation:"'野渡无人舟自横'写出闲适的意境，富有画意。",authorIntro:"韦应物（737-792），唐代诗人，诗风淡雅。",tag:"春天",emoji:"🌿"},
{n:68,title:"夜雨寄北",author:"李商隐",dynasty:"唐",pinyin:"yè yǔ jì běi",content:"君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。",pinyinChars:["jūn","wèn","guī","qī","wèi","yǒu","qī","bā","shān","yè","yǔ","zhǎng","qiū","chí","hé","dāng","gòng","jiǎn","xī","chuāng","zhú","què","huà","bā","shān","yè","yǔ","shí"],translate:"你问归期我还没有定期，巴山夜雨涨满了秋池。何时能一起剪西窗烛，再说起巴山夜雨时的事。",appreciation:"'何当共剪西窗烛'写出对相聚的期盼，回环往复，情深意长。",authorIntro:"李商隐（813-858），字义山，唐代诗人，与杜牧并称'小李杜'。",tag:"思乡",emoji:"🌧️"},
{n:69,title:"寻隐者不遇",author:"贾岛",dynasty:"唐",pinyin:"xún yǐn zhě bù yù",content:"松下问童子，言师采药去。只在此山中，云深不知处。",pinyinChars:["sōng","xià","wèn","tóng","zǐ","yán","shī","cǎi","yào","qù","zhǐ","zài","cǐ","shān","zhōng","yún","shēn","bù","zhī","chù"],translate:"松下询问童子，他说师父采药去了。只在这座山中，云深雾浓不知在哪里。",appreciation:"'云深不知处'写出隐者的神秘与山林的幽深。",authorIntro:"贾岛（779-843），字阆仙，唐代诗人，以'推敲'闻名。",tag:"田园",emoji:"🏔️"},
{n:70,title:"望洞庭",author:"刘禹锡",dynasty:"唐",pinyin:"wàng dòng tíng",content:"湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。",pinyinChars:["hú","guāng","qiū","yuè","liǎng","xiāng","hé","tán","miàn","wú","fēng","jìng","wèi","mó","yáo","wàng","dòng","tíng","shān","shuǐ","cuì","bái","yín","pán","lǐ","yī","qīng","luó"],translate:"湖光与秋月相辉映，潭面无风像未磨的铜镜。远望洞庭山水翠绿，像白银盘里一只青螺。",appreciation:"'白银盘里一青螺'比喻新奇，写出洞庭的秀美。",authorIntro:"刘禹锡（772-842），字梦得，唐代诗人。",tag:"山水",emoji:"🌊"},
{n:71,title:"浪淘沙",author:"刘禹锡",dynasty:"唐",pinyin:"làng táo shā",content:"九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。",pinyinChars:["jiǔ","qū","huáng","hé","wàn","lǐ","shā","làng","táo","fēng","bǒ","zì","tiān","yá","rú","jīn","zhí","shàng","yín","hé","qù","tóng","dào","qiān","niú","zhī","nǚ","jiā"],translate:"九曲黄河带着万里黄沙，浪淘风簸来自天涯。如今径直上银河去，一起到牵牛织女家。",appreciation:"想象奇特，'同到牵牛织女家'富有浪漫色彩。",authorIntro:"刘禹锡（772-842），唐代诗人，诗风豪迈。",tag:"山水",emoji:"📜"},
{n:72,title:"乌衣巷",author:"刘禹锡",dynasty:"唐",pinyin:"wū yī xiàng",content:"朱雀桥边野草花，乌衣巷口夕阳斜。旧时王谢堂前燕，飞入寻常百姓家。",pinyinChars:["zhū","què","qiáo","biān","yě","cǎo","huā","wū","yī","xiàng","kǒu","xī","yáng","xié","jiù","shí","wáng","xiè","táng","qián","yàn","fēi","rù","xún","cháng","bǎi","xìng","jiā"],translate:"朱雀桥边野草开花，乌衣巷口夕阳西斜。旧时王谢堂前的燕子，飞入寻常百姓家中。",appreciation:"'飞入寻常百姓家'写沧海桑田之感，含蓄深沉。",authorIntro:"刘禹锡（772-842），唐代诗人，咏史怀古见长。",tag:"怀古",emoji:"📜"},
{n:73,title:"赋得古原草送别",author:"白居易",dynasty:"唐",pinyin:"fù dé gǔ yuán cǎo sòng bié",content:"离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。",pinyinChars:["lí","lí","yuán","shàng","cǎo","yī","suì","yī","kū","róng","yě","huǒ","shāo","bù","jìn","chūn","fēng","chuī","yòu","shēng"],translate:"原野上的草长得很茂盛，一年一度枯萎又繁荣。野火烧不尽它，春风吹来又生长。",appreciation:"'野火烧不尽，春风吹又生'写野草顽强的生命力，富有哲理。",authorIntro:"白居易（772-846），字乐天，唐代伟大诗人。",tag:"送别",emoji:"🌿"},
{n:74,title:"忆江南",author:"白居易",dynasty:"唐",pinyin:"yì jiāng nán",content:"江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝，能不忆江南？",pinyinChars:["jiāng","nán","hǎo","fēng","jǐng","jiù","céng","ān","rì","chū","jiāng","huā","hóng","shèng","huǒ","chūn","lái","jiāng","shuǐ","lǜ","rú","lán","néng","bù","yì","jiāng","nán"],translate:"江南好，风景我曾熟悉。日出时江花比火还红，春天江水像蓝草一样绿，能不忆江南？",appreciation:"'日出江花红胜火，春来江水绿如蓝'色彩浓烈，写出江南之美。",authorIntro:"白居易（772-846），唐代诗人，诗风通俗。",tag:"思乡",emoji:"📜"},
{n:75,title:"暮江吟",author:"白居易",dynasty:"唐",pinyin:"mù jiāng yín",content:"一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。",pinyinChars:["yī","dào","cán","yáng","pū","shuǐ","zhōng","bàn","jiāng","sè","sè","bàn","jiāng","hóng","kě","lián","jiǔ","yuè","chū","sān","yè","lù","sì","zhēn","zhū","yuè","sì","gōng"],translate:"一道夕阳铺在水中，半江碧绿半江红艳。可爱的是九月初三的夜晚，露水像珍珠月亮像弓。",appreciation:"'露似真珠月似弓'比喻贴切，写出秋夜的清新。",authorIntro:"白居易（772-846），唐代伟大诗人。",tag:"秋天",emoji:"🌅"},
{n:76,title:"钱塘湖春行",author:"白居易",dynasty:"唐",pinyin:"qián táng hú chūn xíng",content:"孤山寺北贾亭西，水面初平云脚低。几处早莺争暖树，谁家新燕啄春泥。",pinyinChars:["gū","shān","sì","běi","jiǎ","tíng","xī","shuǐ","miàn","chū","píng","yún","jiǎo","dī","jǐ","chù","zǎo","yīng","zhēng","nuǎn","shù","shuí","jiā","xīn","yàn","zhuó","chūn","ní"],translate:"孤山寺北贾亭西边，水面初平云脚低垂。几处早莺争着飞向暖树，谁家新燕在啄春泥。",appreciation:"'争暖树''啄春泥'写出早春的生机，'早''新'二字尤妙。",authorIntro:"白居易（772-846），唐代诗人，写景细腻。",tag:"春天",emoji:"📜"},
{n:77,title:"江上渔者",author:"范仲淹",dynasty:"北宋",pinyin:"jiāng shàng yú zhě",content:"江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。",pinyinChars:["jiāng","shàng","wǎng","lái","rén","dàn","ài","lú","yú","měi","jūn","kàn","yī","yè","zhōu","chū","mò","fēng","bō","lǐ"],translate:"江上来来往往的人，只爱鲈鱼的鲜美。请看那叶小舟，在风浪中出没。",appreciation:"以渔民劳作的艰辛对比食客的享受，含同情之意。",authorIntro:"范仲淹（989-1052），字希文，北宋政治家、文学家。",tag:"咏物",emoji:"📜"},
{n:78,title:"书湖阴先生壁",author:"王安石",dynasty:"北宋",pinyin:"shū hú yīn xiān shēng bì",content:"茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。",pinyinChars:["máo","yán","cháng","sǎo","jìng","wú","tái","huā","mù","chéng","qí","shǒu","zì","zāi","yī","shuǐ","hù","tián","jiāng","lǜ","rào","liǎng","shān","pái","tà","sòng","qīng","lái"],translate:"茅檐常打扫得干净无苔，花木成行亲手栽种。一条水护田将绿绕，两山推门送来青色。",appreciation:"'两山排闼送青来'拟人化，写出山的灵动。",authorIntro:"王安石（1021-1086），北宋文学家。",tag:"田园",emoji:"📜"},
{n:79,title:"六月二十七日望湖楼醉书其二",author:"苏轼",dynasty:"北宋",pinyin:"liù yuè èr shí qī rì wàng hú lóu zuì shū qí èr",content:"放生鱼鳖逐人来，无主荷花到处开。水枕能令山俯仰，风船解与月裴回。",pinyinChars:["fàng","shēng","yú","biē","zhú","rén","lái","wú","zhǔ","hé","huā","dào","chù","kāi","shuǐ","zhěn","néng","lìng","shān","fǔ","yǎng","fēng","chuán","jiě","yǔ","yuè","péi","huí"],translate:"放生的鱼鳖追逐人来，无主的荷花到处开放。水枕能让山俯仰，风船能与月徘徊。",appreciation:"写西湖的生机与闲适，富有情趣。",authorIntro:"苏轼（1037-1101），北宋文学巨匠。",tag:"夏天",emoji:"📜"},
{n:80,title:"惠崇春江晚景其二",author:"苏轼",dynasty:"北宋",pinyin:"huì chóng chūn jiāng wǎn jǐng qí èr",content:"两两归鸿欲破群，依依还是北归人。遥知朔漠多风雪，更待江南半月春。",pinyinChars:["liǎng","liǎng","guī","hóng","yù","pò","qún","yī","yī","hái","shì","běi","guī","rén","yáo","zhī","shuò","mò","duō","fēng","xuě","gèng","dài","jiāng","nán","bàn","yuè","chūn"],translate:"成对的归鸿要离群而去，依依不舍还是北归的人。遥知北方沙漠多风雪，更待江南半月的春光。",appreciation:"写归鸿与人的离情，含蓄深沉。",authorIntro:"苏轼（1037-1101），北宋文学家。",tag:"春天",emoji:"📜"},
{n:81,title:"三衢道中",author:"曾几",dynasty:"南宋",pinyin:"sān qú dào zhōng",content:"梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。",pinyinChars:["méi","zǐ","huáng","shí","rì","rì","qíng","xiǎo","xī","fàn","jìn","què","shān","xíng","lǜ","yīn","bù","jiǎn","lái","shí","lù","tiān","dé","huáng","lí","sì","wǔ","shēng"],translate:"梅子黄时天天晴朗，小溪泛舟尽头又山路行。绿阴不比来时少，还添了四五声黄鹂鸣叫。",appreciation:"'添得黄鹂四五声'写出归途的欣喜。",authorIntro:"曾几（1084-1166），字吉甫，南宋诗人。",tag:"夏天",emoji:"🌳"},
{n:82,title:"题临安邸",author:"林升",dynasty:"南宋",pinyin:"tí lín ān dǐ",content:"山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。",pinyinChars:["shān","wài","qīng","shān","lóu","wài","lóu","xī","hú","gē","wǔ","jǐ","shí","xiū","nuǎn","fēng","xūn","dé","yóu","rén","zuì","zhí","bǎ","háng","zhōu","zuò","biàn","zhōu"],translate:"山外有青山楼外有楼，西湖的歌舞何时才休？暖风熏得游人沉醉，简直把杭州当成了汴州。",appreciation:"讽刺南宋统治者偏安一隅，'直把杭州作汴州'讽刺辛辣。",authorIntro:"林升（生卒年不详），南宋诗人。",tag:"忧国",emoji:"📜"},
{n:83,title:"游园不值",author:"叶绍翁",dynasty:"南宋",pinyin:"yóu yuán bù zhí",content:"应怜屐齿印苍苔，小扣柴扉久不开。春色满园关不住，一枝红杏出墙来。",pinyinChars:["yīng","lián","jī","chǐ","yìn","cāng","tái","xiǎo","kòu","chái","fēi","jiǔ","bù","kāi","chūn","sè","mǎn","yuán","guān","bù","zhù","yī","zhī","hóng","xìng","chū","qiáng","lái"],translate:"大概是怜惜屐齿踩伤苍苔，轻敲柴门久不开。满园春色关不住，一枝红杏伸出墙来。",appreciation:"'春色满园关不住，一枝红杏出墙来'写出春天的蓬勃生机。",authorIntro:"叶绍翁（生卒年不详），字嗣宗，南宋诗人。",tag:"春天",emoji:"🌺"},
{n:84,title:"墨梅",author:"王冕",dynasty:"元",pinyin:"mò méi",content:"吾家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤。",pinyinChars:["wú","jiā","xǐ","yàn","chí","tóu","shù","duǒ","duǒ","huā","kāi","dàn","mò","hén","bù","yào","rén","kuā","hǎo","yán","sè","zhǐ","liú","qīng","qì","mǎn","qián","kūn"],translate:"我家洗砚池边的梅树，朵朵花开带着淡墨痕。不要人夸它颜色好，只留清气充满天地。",appreciation:"以墨梅自喻，'只留清气满乾坤'写出诗人的高洁。",authorIntro:"王冕（1287-1359），字元章，元代画家、诗人。",tag:"咏物",emoji:"🌸"},
{n:85,title:"画",author:"王维",dynasty:"唐",pinyin:"huà",content:"远看山有色，近听水无声。春去花还在，人来鸟不惊。",pinyinChars:["yuǎn","kàn","shān","yǒu","sè","jìn","tīng","shuǐ","wú","shēng","chūn","qù","huā","hái","zài","rén","lái","niǎo","bù","jīng"],translate:"远看山有色，近听水无声。春天过去花还在，人来了鸟不惊。",appreciation:"写画中景，以'无声''不惊'反衬画的逼真。",authorIntro:"王维（701-761），唐代诗人、画家。",tag:"咏物",emoji:"🎨"},
{n:86,title:"画鸡",author:"唐寅",dynasty:"明",pinyin:"huà jī",content:"头上红冠不用裁，满身雪白走将来。平生不敢轻言语，一叫千门万户开。",pinyinChars:["tóu","shàng","hóng","guān","bù","yòng","cái","mǎn","shēn","xuě","bái","zǒu","jiāng","lái","píng","shēng","bù","gǎn","qīng","yán","yǔ","yī","jiào","qiān","mén","wàn","hù","kāi"],translate:"头上的红冠不用裁剪，满身雪白走过来。平生不敢轻易说话，一叫千家万户的门都开了。",appreciation:"以公鸡自喻，'一叫千门万户开'写出雄鸡的气概。",authorIntro:"唐寅（1470-1524），字伯虎，明代画家、诗人。",tag:"动物",emoji:"📜"},
{n:87,title:"风",author:"李峤",dynasty:"唐",pinyin:"fēng",content:"解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。",pinyinChars:["jiě","luò","sān","qiū","yè","néng","kāi","èr","yuè","huā","guò","jiāng","qiān","chǐ","làng","rù","zhú","wàn","gān","xié"],translate:"能吹落秋天的树叶，能吹开二月的鲜花。过江掀起千尺浪，入竹让万竿竹子倾斜。",appreciation:"全诗不见一个'风'字，却句句写风，构思巧妙。",authorIntro:"李峤（644-713），字巨山，唐代诗人。",tag:"咏物",emoji:"📜"},
{n:88,title:"送友人",author:"李白",dynasty:"唐",pinyin:"sòng yǒu rén",content:"青山横北郭，白水绕东城。此地一为别，孤蓬万里征。",pinyinChars:["qīng","shān","héng","běi","guō","bái","shuǐ","rào","dōng","chéng","cǐ","dì","yī","wéi","bié","gū","péng","wàn","lǐ","zhēng"],translate:"青山横卧在北城，白水环绕东城。在此一别，你像孤蓬万里远行。",appreciation:"'孤蓬万里征'写出友人的漂泊与离愁。",authorIntro:"李白（701-762），唐代伟大诗人。",tag:"送别",emoji:"📜"},
{n:89,title:"赠花卿",author:"杜甫",dynasty:"唐",pinyin:"zèng huā qīng",content:"锦城丝管日纷纷，半入江风半入云。此曲只应天上有，人间能得几回闻。",pinyinChars:["jǐn","chéng","sī","guǎn","rì","fēn","fēn","bàn","rù","jiāng","fēng","bàn","rù","yún","cǐ","qǔ","zhǐ","yīng","tiān","shàng","yǒu","rén","jiān","néng","dé","jǐ","huí","wén"],translate:"锦城音乐声日日纷纷，一半入江风一半入云。这样的曲子只应天上有，人间能听到几回？",appreciation:"'此曲只应天上有'成为赞美音乐的千古名句。",authorIntro:"杜甫（712-770），唐代伟大诗人。",tag:"咏物",emoji:"📜"},
{n:90,title:"八阵图",author:"杜甫",dynasty:"唐",pinyin:"bā zhèn tú",content:"功盖三分国，名成八阵图。江流石不转，遗恨失吞吴。",pinyinChars:["gōng","gài","sān","fēn","guó","míng","chéng","bā","zhèn","tú","jiāng","liú","shí","bù","zhuǎn","yí","hèn","shī","tūn","wú"],translate:"功业盖过三分天下，名声成就于八阵图。江水奔流石头不转，遗恨在于未能吞灭东吴。",appreciation:"咏诸葛亮，'江流石不转'赞其功业永存。",authorIntro:"杜甫（712-770），唐代伟大诗人。",tag:"怀古",emoji:"📜"},
{n:91,title:"秋浦歌",author:"李白",dynasty:"唐",pinyin:"qiū pǔ gē",content:"白发三千丈，缘愁似个长。不知明镜里，何处得秋霜。",pinyinChars:["bái","fà","sān","qiān","zhàng","yuán","chóu","sì","gè","cháng","bù","zhī","míng","jìng","lǐ","hé","chù","dé","qiū","shuāng"],translate:"白发有三千丈长，因为愁绪也这样长。不知明镜里，哪里得来这秋霜？",appreciation:"'白发三千丈'的夸张写出愁之深，'秋霜'喻白发。",authorIntro:"李白（701-762），唐代伟大诗人。",tag:"咏怀",emoji:"📜"},
{n:92,title:"子夜吴歌",author:"李白",dynasty:"唐",pinyin:"zǐ yè wú gē",content:"长安一片月，万户捣衣声。秋风吹不尽，总是玉关情。",pinyinChars:["cháng","ān","yī","piàn","yuè","wàn","hù","dǎo","yī","shēng","qiū","fēng","chuī","bù","jìn","zǒng","shì","yù","guān","qíng"],translate:"长安城一片月光，千家万户捣衣声。秋风吹不尽的，都是对玉门关的思念之情。",appreciation:"'秋风吹不尽，总是玉关情'写出思妇对征人的思念。",authorIntro:"李白（701-762），唐代伟大诗人。",tag:"边塞",emoji:"📜"},
{n:93,title:"客至",author:"杜甫",dynasty:"唐",pinyin:"kè zhì",content:"舍南舍北皆春水，但见群鸥日日来。花径不曾缘客扫，蓬门今始为君开。",pinyinChars:["shè","nán","shè","běi","jiē","chūn","shuǐ","dàn","jiàn","qún","ōu","rì","rì","lái","huā","jìng","bù","céng","yuán","kè","sǎo","péng","mén","jīn","shǐ","wèi","jūn","kāi"],translate:"屋舍南北都是春水，只见群鸥天天飞来。花径不曾因客人打扫，蓬门今天才为你打开。",appreciation:"'蓬门今始为君开'写出对客人的热情。",authorIntro:"杜甫（712-770），唐代伟大诗人。",tag:"田园",emoji:"📜"},
{n:94,title:"春夜喜雨",author:"杜甫",dynasty:"唐",pinyin:"chūn yè xǐ yǔ",content:"好雨知时节，当春乃发生。随风潜入夜，润物细无声。",pinyinChars:["hǎo","yǔ","zhī","shí","jié","dāng","chūn","nǎi","fā","shēng","suí","fēng","qián","rù","yè","rùn","wù","xì","wú","shēng"],translate:"好雨知道下雨的节气，春天来了就下雨。随风在夜里悄悄落下，润物细密无声。",appreciation:"'随风潜入夜，润物细无声'写春雨的轻柔，传诵千古。",authorIntro:"杜甫（712-770），唐代伟大现实主义诗人。",tag:"春天",emoji:"🌧️"},
{n:95,title:"绝句其二",author:"杜甫",dynasty:"唐",pinyin:"jué jù qí èr",content:"迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。",pinyinChars:["chí","rì","jiāng","shān","lì","chūn","fēng","huā","cǎo","xiāng","ní","róng","fēi","yàn","zǐ","shā","nuǎn","shuì","yuān","yāng"],translate:"春日江山秀丽，春风送来花草香。泥土融化燕子飞舞，沙地温暖鸳鸯安睡。",appreciation:"四句四景，色彩明丽，写出春日的勃勃生机。",authorIntro:"杜甫（712-770），唐代伟大诗人。",tag:"春天",emoji:"📜"},
{n:96,title:"江畔独步寻花",author:"杜甫",dynasty:"唐",pinyin:"jiāng pàn dú bù xún huā",content:"黄四娘家花满蹊，千朵万朵压枝低。留连戏蝶时时舞，自在娇莺恰恰啼。",pinyinChars:["huáng","sì","niáng","jiā","huā","mǎn","qī","qiān","duǒ","wàn","duǒ","yā","zhī","dī","liú","lián","xì","dié","shí","shí","wǔ","zì","zài","jiāo","yīng","qià","qià","tí"],translate:"黄四娘家花开满小路，千朵万朵压弯枝条。流连的蝴蝶时时起舞，自在的黄莺恰恰鸣叫。",appreciation:"'留连戏蝶''自在娇莺'写出春花的繁盛与生机。",authorIntro:"杜甫（712-770），唐代伟大诗人。",tag:"春天",emoji:"📜"},
{n:97,title:"枫桥夜泊",author:"张继",dynasty:"唐",pinyin:"fēng qiáo yè bó",content:"月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。",pinyinChars:["yuè","luò","wū","tí","shuāng","mǎn","tiān","jiāng","fēng","yú","huǒ","duì","chóu","mián","gū","sū","chéng","wài","hán","shān","sì","yè","bàn","zhōng","shēng","dào","kè","chuán"],translate:"月亮落下乌鸦啼叫霜满天，江枫渔火伴着愁眠。姑苏城外寒山寺，半夜钟声传到客船。",appreciation:"'夜半钟声到客船'写出旅人的孤寂，意境深远。",authorIntro:"张继（生卒年不详），字懿孙，唐代诗人。",tag:"思乡",emoji:"📜"},
{n:98,title:"寒食",author:"韩翃",dynasty:"唐",pinyin:"hán shí",content:"春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。",pinyinChars:["chūn","chéng","wú","chù","bù","fēi","huā","hán","shí","dōng","fēng","yù","liǔ","xié","rì","mù","hàn","gōng","chuán","là","zhú","qīng","yān","sàn","rù","wǔ","hóu","jiā"],translate:"春城无处不飞花，寒食东风吹斜御柳。日暮汉宫传赐蜡烛，轻烟散入五侯之家。",appreciation:"'春城无处不飞花'写出寒食的春景，'轻烟散入'暗含讽意。",authorIntro:"韩翃（生卒年不详），字君平，唐代诗人。",tag:"春天",emoji:"📜"},
{n:99,title:"滁州西涧其二",author:"韦应物",dynasty:"唐",pinyin:"chú zhōu xī jiàn qí èr",content:"独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。",pinyinChars:["dú","lián","yōu","cǎo","jiàn","biān","shēng","shàng","yǒu","huáng","lí","shēn","shù","míng","chūn","cháo","dài","yǔ","wǎn","lái","jí","yě","dù","wú","rén","zhōu","zì","héng"],translate:"独爱涧边生长的幽草，树深处有黄鹂鸣叫。春潮带雨傍晚来得急，野渡无人小船独自横着。",appreciation:"'野渡无人舟自横'写出闲适的意境，富有画意。",authorIntro:"韦应物（737-792），唐代诗人，诗风淡雅。",tag:"春天",emoji:"📜"},
{n:100,title:"登飞来峰",author:"王安石",dynasty:"北宋",pinyin:"dēng fēi lái fēng",content:"飞来山上千寻塔，闻说鸡鸣见日升。不畏浮云遮望眼，自缘身在最高层。",pinyinChars:["fēi","lái","shān","shàng","qiān","xún","tǎ","wén","shuō","jī","míng","jiàn","rì","shēng","bù","wèi","fú","yún","zhē","wàng","yǎn","zì","yuán","shēn","zài","zuì","gāo","céng"],translate:"飞来山上有千寻高塔，听说鸡鸣时可见日出。不怕浮云遮住远望的视线，只因为身在最高层。",appreciation:"'不畏浮云遮望眼，自缘身在最高层'蕴含站得高看得远的哲理。",authorIntro:"王安石（1021-1086），北宋政治家、文学家。",tag:"励志",emoji:"📜"}
]

let learned=JSON.parse(localStorage.getItem('xy_learned_v1')||'{}');
function saveLearned(){localStorage.setItem('xy_learned_v1',JSON.stringify(learned))}
let curCat='全部';
const CATS=['全部','春天','夏天','秋天','冬天','山水','田园','思乡','送别','边塞','怀古','忧国','咏物','励志','感恩','哲理','春节','动物'];
function renderCatBar(){document.getElementById('catBar').innerHTML=CATS.map((c,i)=>`<div class="cb ${i===0?'active':''}" data-c="${c}" onclick="pickCat('${c}')">${c}</div>`).join('')}
function pickCat(c){curCat=c;document.querySelectorAll('.cat-bar .cb').forEach(b=>b.classList.toggle('active',b.dataset.c===c));filterPoems()}
function filterPoems(){
  const kw=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  let arr=POEMS;
  if(curCat!=='全部')arr=arr.filter(p=>p.tag===curCat);
  if(kw)arr=arr.filter(p=>p.title.includes(kw)||p.author.toLowerCase().includes(kw)||p.tag.includes(kw));
  renderPoems(arr);
  document.getElementById('resultCount').textContent='共'+arr.length+'首';
}
function renderPoems(list){
  if(!list)list=POEMS;
  const g=document.getElementById('poemGrid');
  if(!list.length){g.innerHTML='<div class="empty"><div class="ei">🔍</div><div>没有找到相关古诗</div></div>';return}
  g.innerHTML=list.map(p=>{
    const isL=learned[p.n];
    const dyn=p.dynasty||'';
    const emoji=p.emoji||'📜';
    const trans=p.translate?p.translate.slice(0,60):'';
    return `<div class="poem-card ${isL?'learned':''}" onclick="toggleLearn(${p.n})">
      <div class="pc-head"><div class="pc-title">${p.n}. ${p.title}</div><div class="pc-check">${isL?'✅':'⬜'}</div></div>
      <div class="pc-emoji">${emoji}</div>
      <div class="pc-author">${dyn?'【'+dyn+'】':''}${p.author}</div>
      <div class="pc-content">${p.content}</div>
      ${trans?`<div class="pc-translate">📖 ${trans}${p.translate&&p.translate.length>60?'...':''}</div>`:''}
      <div class="pc-foot">
        <span class="pc-tag">${p.tag}</span>
        <span class="pc-read" onclick="event.stopPropagation();readPoem(${p.n})">🔊 朗读</span>
      </div>
    </div>`;
  }).join('');
  const cnt=Object.keys(learned).filter(k=>learned[k]).length;
  document.getElementById('learnedCount').textContent=cnt;
  document.getElementById('progressPct').textContent=Math.round(cnt/100*100)+'%';
}
function toggleLearn(n){
  if(learned[n]){learned[n]=false;toast('取消标记')}
  else{learned[n]=true;toast('✅ 已学习！');addSun(5)}
  saveLearned();
  filterPoems();
}
function readPoem(n){
  const p=POEMS.find(x=>x.n===n);
  if(!p)return;
  const text=p.title+'，'+p.author+'。'+p.content;
  speak(text,'zh-CN');
}

const ENG_CATS=['全部','短句','颜色','动物','果蔬','物品','交通','家人','食物','身体','天气','星期','月份','数字'];
let engCurCat='全部';
let engCurSearch='';
function renderEngCatBar(){document.getElementById('engCatBar').innerHTML=ENG_CATS.map((c,i)=>`<div class="cb ${i===0?'active':''}" data-c="${c}" onclick="pickEngCat('${c}')">${c}</div>`).join('')}
function pickEngCat(c){engCurCat=c;document.querySelectorAll('#engCatBar .cb').forEach(b=>b.classList.toggle('active',b.dataset.c===c));filterEng()}
function filterEng(){engCurSearch=(document.getElementById('engSearch').value||'').trim().toLowerCase();renderEngGrid()}
function renderEng(){
  if(!document.getElementById('engCatBar').children.length)renderEngCatBar();
  document.getElementById('engTotal').textContent=ENG_DATA.length;
  renderEngGrid();
}
function renderEngGrid(){
  let arr=ENG_DATA;
  if(engCurCat!=='全部')arr=arr.filter(w=>w.cat===engCurCat);
  if(engCurSearch)arr=arr.filter(w=>w.en.toLowerCase().includes(engCurSearch)||w.cn.includes(engCurSearch));
  const g=document.getElementById('engGrid');
  document.getElementById('engResultCount').textContent='共'+arr.length+'条';
  if(!arr.length){g.innerHTML='<div class="empty"><div class="ei">🔍</div><div>没有找到相关内容</div></div>';return}
  g.innerHTML=arr.map((w,i)=>{
    const idx=ENG_DATA.indexOf(w);
    const enSafe=w.en.replace(/'/g,"\'");
    return `<div class="eng-card" onclick="openEngDetail(${idx})">
      <div class="ec-cat">${w.cat}</div>
      <div class="ec-emoji">${w.emoji}</div>
      <div class="ec-en">${w.en}</div>
      <div class="ec-cn">${w.cn}</div>
      <div class="ec-read" onclick="event.stopPropagation();speakEng('${enSafe}')">🔊</div>
    </div>`;
  }).join('');
}
function speakEng(text){speak(text,'en-US')}
function openEngDetail(idx){
  const w=ENG_DATA[idx];
  if(!w)return;
  const enSafe=w.en.replace(/'/g,"\'");
  document.getElementById('engBody').innerHTML=
    '<div class="eng-detail-emoji">'+w.emoji+'</div>'+
    '<div class="eng-detail-en">'+w.en+'</div>'+
    '<div class="eng-detail-cn">'+w.cn+'</div>'+
    '<div class="detail-section"><h4>📂 分类</h4><div class="ds-content">'+w.cat+'</div></div>'+
    '<button class="btn-read" onclick="speakEng(\''+enSafe+'\')">🔊 慢速朗读</button>'+
    '<button class="btn-read" style="background:var(--green)" onclick="speakEngSlow(\''+enSafe+'\')">🐢 超慢朗读</button>';
  openModal('engModal');
}
function speakEngSlow(text){
  if(!('speechSynthesis' in window)){toast('浏览器不支持朗读');return}
  stopSpeak();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.4;u.pitch=1.2;
  speechSynthesis.speak(u);
}

  {n:48,cn:"四十八",en:"forty-eight",item:"面包",emoji:"🍞",clf:"块"},
  {n:49,cn:"四十九",en:"forty-nine",item:"米饭",emoji:"🍚",clf:"碗"},
  {n:50,cn:"五十",en:"fifty",item:"面条",emoji:"🍜",clf:"碗"}
];
const CALC_EMOJI=['🍎','🍓','🌸','⭐','🐠','🎈','🐯','🍋','🦋','🐧'];
let mathCurMode='';
function mathMode(m){
  mathCurMode=m;
  document.getElementById('mathModeNum').className='big-btn '+(m==='num'?'primary':'outline');
  document.getElementById('mathModeCalc').className='big-btn '+(m==='calc'?'primary':'outline');
  if(m==='num')renderNum();
  else calcMode('learn');
}
function renderNum(){
  document.getElementById('mathBox').innerHTML=
    '<div class="panel"><div class="panel-title"><span class="ico">🔢</span><span>认识数字 1-50</span></div><div class="divider"></div>'+
    '<div class="num-grid" id="numGrid"></div>'+
    '<div class="big-btn-row">'+
      '<button class="big-btn primary" onclick="numSeqPlay()">▶️ 顺序跟读</button>'+
      '<button class="big-btn outline" onclick="numRandomGame()">🎲 随机翻卡</button>'+
    '</div></div>';
  document.getElementById('numGrid').innerHTML=NUM_DATA.map(d=>{
    const emojis=d.emoji.repeat(d.n).slice(0,d.n*4);
    return `<div class="num-card" onclick="readNum(${d.n})">
      <div class="nc-big">${d.n}</div>
      <div class="nc-cn">${d.cn}</div>
      <div class="nc-en">${d.en}</div>
      <div class="nc-emoji">${d.emoji.repeat(Math.min(d.n,10))}</div>
    </div>`;
  }).join('');
}
function readNum(n){
  const d=NUM_DATA.find(x=>x.n===n);
  if(!d)return;
  const text=`${d.n}，${d.clf}${d.item}；${d.en}`;
  speak(text,'zh-CN');
  toast('🔊 '+text);
}
let numSeqIdx=0;let numSeqTimer=null;
function numSeqPlay(){
  stopSpeak();
  if(numSeqTimer){clearTimeout(numSeqTimer);numSeqTimer=null;toast('⏸️ 停止跟读');return}
  numSeqIdx=0;
  playNextNum();
}
function playNextNum(){
  if(numSeqIdx>=50){toast('🎉 全部读完了！');numSeqTimer=null;addSun(10);return}
  const d=NUM_DATA[numSeqIdx];
  const text=`${d.n}，${d.clf}${d.item}；${d.en}`;
  speak(text,'zh-CN',()=>{numSeqIdx++;numSeqTimer=setTimeout(playNextNum,800)});
}
let numGameIdx=0;
let numGameArr=[];
let numGameCur=null;
function numRandomGame(){
  numGameArr=[...NUM_DATA].sort(()=>Math.random()-0.5);
  numGameIdx=0;
  showNumCard();
}
function showNumCard(){
  const d=numGameArr[numGameIdx];
  numGameCur=d;
  document.getElementById('mathBox').innerHTML=
    '<div class="panel"><div class="panel-title"><span class="ico">🎲</span><span>随机翻卡 '+(numGameIdx+1)+'/'+numGameArr.length+'</span></div><div class="divider"></div>'+
    '<div class="num-card" style="cursor:pointer" onclick="readNumGameCard()">'+
      '<div class="nc-big" style="font-size:80px">'+d.n+'</div>'+
      '<div class="nc-cn" style="font-size:24px">'+d.cn+'</div>'+
      '<div class="nc-en" style="font-size:20px">'+d.en+'</div>'+
      '<div class="nc-emoji" style="font-size:28px;margin-top:12px">'+d.emoji.repeat(Math.min(d.n,10))+'</div>'+
    '</div>'+
    '<button class="btn-read" onclick="readNumGameCard()">🔊 朗读</button>'+
    '<div class="big-btn-row">'+
      '<button class="big-btn outline" onclick="nextNumCard()">🔄 换一张</button>'+
      '<button class="big-btn primary" onclick="mathMode(\'num\')">🔙 返回列表</button>'+
    '</div></div>';
}
function nextNumCard(){
  numGameIdx=(numGameIdx+1)%numGameArr.length;
  showNumCard();
}
function readNumGameCard(){
  const d=numGameCur;
  if(!d)return;
  const text=d.n+'，'+d.clf+d.item+'；'+d.en;
  speak(text,'zh-CN');
  toast('🔊 '+text);
}

// ====== 加减法模块 ======
let calcCurMode='learn';
function calcMode(m){
  calcCurMode=m;
  if(m==='learn')renderCalcLearn();
  else renderCalcQuiz();
}
function renderCalcLearn(){
  const items=[];
  for(let a=1;a<=5;a++)for(let b=1;b<=5&&a+b<=10;b++)items.push({op:'+',a,b,r:a+b});
  for(let a=2;a<=10;a++)for(let b=1;b<a;b++)items.push({op:'-',a,b,r:a-b});
  const sel=items.filter((_,i)=>i%3===0).slice(0,12);
  document.getElementById('mathBox').innerHTML=
    '<div class="big-btn-row" style="margin-bottom:16px">'+
    '<button class="big-btn primary" onclick="calcMode(\'learn\')">📖 看图学习</button>'+
    '<button class="big-btn outline" onclick="calcMode(\'quiz\')">🎲 随机出题</button>'+
    '</div>'+sel.map((it,i)=>calcCard(it,i)).join('');
}
function calcCard(it,i){
  const em=CALC_EMOJI[i%CALC_EMOJI.length];
  const itemName=['苹果','草莓','花朵','星星','小鱼','气球','老虎','柠檬','蝴蝶','企鹅','鸭子','糖果'][i%12];
  let cells='';
  for(let k=0;k<10;k++){
    let cls='';
    if(k<it.a)cls='filled-a';
    else if(k<it.a+it.b&&it.op==='+')cls='filled-b';
    else if(k<it.a-it.b&&it.op==='-')cls='filled-a';
    cells+='<div class="tf-cell '+cls+'">'+(cls?em:'')+'</div>';
  }
  let emojiRow='';
  if(it.op==='+')emojiRow=em.repeat(it.a)+' + '+em.repeat(it.b)+' = '+em.repeat(it.r);
  else emojiRow=em.repeat(it.a)+' − ('+em.repeat(it.b)+') = '+em.repeat(it.r);
  const eq=it.a+(it.op==='+'?' + ':' − ')+it.b+' = '+it.r;
  const readText=it.a+'个'+itemName+(it.op==='+'?'加':'减')+it.b+'个'+itemName+'等于'+it.r+'个'+itemName;
  return '<div class="calc-card">'+
    '<div class="calc-eq">'+eq+'</div>'+
    '<div class="calc-emoji-row">'+emojiRow+'</div>'+
    '<div class="ten-frame">'+cells+'</div>'+
    '<button class="btn-read" onclick="readCalc('+it.a+',\''+it.op+'\','+it.b+','+it.r+',\''+itemName+'\')">🔊 朗读算式</button>'+
  '</div>';
}
function readCalc(a,op,b,r,itemName){
  const text=a+'个'+itemName+(op==='+'?'加':'减')+b+'个'+itemName+'等于'+r+'个'+itemName;
  speak(text,'zh-CN');
  toast('🔊 '+text);
}
let quizCur=null;
function renderCalcQuiz(){
  const a=Math.floor(Math.random()*9)+1;
  const b=Math.floor(Math.random()*9)+1;
  let op,q,ans;
  if(Math.random()>0.5){op='+';ans=a+b;if(ans>10)return renderCalcQuiz();q=a+' + '+b+' = ?'}
  else{if(a<b)return renderCalcQuiz();op='-';ans=a-b;q=a+' − '+b+' = ?'}
  quizCur={a,op,b,r:ans};
  const em=CALC_EMOJI[Math.floor(Math.random()*CALC_EMOJI.length)];
  const itemName=['苹果','草莓','花朵','星星','小鱼','气球'][Math.floor(Math.random()*6)];
  let cells='';
  for(let k=0;k<10;k++){
    let cls='';
    if(k<a)cls='filled-a';
    else if(k<a+b&&op==='+')cls='filled-b';
    else if(k<a-b&&op==='-')cls='filled-a';
    cells+='<div class="tf-cell '+cls+'">'+(cls?em:'')+'</div>';
  }
  let emojiRow=op==='+'?em.repeat(a)+' + '+em.repeat(b):em.repeat(a)+' − ('+em.repeat(b)+')';
  const opts=[...new Set([ans,Math.max(0,ans-1),ans+1,Math.max(0,ans-2)])].slice(0,4).sort(()=>Math.random()-0.5);
  document.getElementById('mathBox').innerHTML=
    '<div class="big-btn-row" style="margin-bottom:16px">'+
    '<button class="big-btn outline" onclick="calcMode(\'learn\')">📖 看图学习</button>'+
    '<button class="big-btn primary" onclick="calcMode(\'quiz\')">🎲 随机出题</button>'+
    '</div>'+
    '<div class="calc-card">'+
      '<div class="calc-eq">'+q+'</div>'+
      '<div class="calc-emoji-row">'+emojiRow+'</div>'+
      '<div class="ten-frame">'+cells+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">'+
        opts.map(o=>'<button class="big-btn ghost" onclick="answerCalc('+o+',\''+itemName+'\')">'+o+'</button>').join('')+
      '</div>'+
      '<button class="btn-read" style="margin-top:14px" onclick="readCalcQuiz(\''+itemName+'\')">🔊 听题目</button>'+
    '</div>';
}
function readCalcQuiz(itemName){
  if(!quizCur)return;
  const q=quizCur.a+'个'+itemName+(quizCur.op==='+'?'加':'减')+quizCur.b+'个'+itemName+'等于几';
  speak(q,'zh-CN');
}
function answerCalc(o,itemName){
  if(!quizCur)return;
  if(o===quizCur.r){
    toast('✓ 答对了！');
    const text=quizCur.a+'个'+itemName+(quizCur.op==='+'?'加':'减')+quizCur.b+'个'+itemName+'等于'+quizCur.r+'个'+itemName;
    speak(text,'zh-CN');
    addSun(3);
    setTimeout(renderCalcQuiz,2000);
  }else{
    toast('✗ 再想想');
  }
}

// 初始化
renderCatBar();
renderPoems();
</script>
